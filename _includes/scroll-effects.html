<script>
  // Efeitos de rolagem usados nas páginas internas:
  // - .reveal: aparece suavemente quando entra na tela;
  // - .hscroll-wrap: carrossel horizontal com botões de avançar/voltar;
  // - [data-count]: número que conta de zero até o valor ao aparecer;
  // - .compare: comparador de imagens antes/depois com divisor arrastável.
  // A classe has-js no <html> permite que, sem JavaScript, tudo fique visível.
  document.documentElement.classList.add("has-js");

  document.addEventListener("DOMContentLoaded", function () {
    var reduzido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function escaparHtml(texto) {
      var d = document.createElement("div");
      d.textContent = texto;
      return d.innerHTML;
    }

    function formatar(valor, decimais, milhares, decimal) {
      var partes = valor.toFixed(decimais).split(".");
      if (milhares) {
        partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, milhares);
      }
      return partes.join(decimal);
    }
  
    function contar(el) {
      var decimais = parseInt(el.getAttribute("data-decimals") || "0", 10);
      var milhares = el.getAttribute("data-thousands") || "";
      var decimal = el.getAttribute("data-decimal") || ",";
      var alvo = parseFloat(el.getAttribute("data-count"));
      var prefixo = el.getAttribute("data-prefix") || "";
      var sufixo = el.getAttribute("data-suffix") || "";
      if (reduzido) {
        el.textContent = prefixo + formatar(alvo, decimais, milhares, decimal) + sufixo;
        return;
      }
      var inicio = null;
      function passo(agora) {
        if (!inicio) inicio = agora;
        var fracao = Math.min((agora - inicio) / 1200, 1);
        var suave = 1 - Math.pow(1 - fracao, 3);
        el.textContent = prefixo + formatar(alvo * suave, decimais, milhares, decimal) + sufixo;
        if (fracao < 1) requestAnimationFrame(passo);
      }
      requestAnimationFrame(passo);
    }

    var reveais = document.querySelectorAll(".reveal");

    // Revela um elemento e dispara os contadores que estiverem dentro dele
    function revelar(el) {
      if (el.classList.contains("revealed")) return;
      el.classList.add("revealed");
      var numeros = el.querySelectorAll("[data-count]");
      for (var n = 0; n < numeros.length; n++) contar(numeros[n]);
    }

    // Revela tudo que já está na tela, usado pela rede de segurança abaixo
    function revelarVisiveis() {
      for (var r = 0; r < reveais.length; r++) {
        if (reveais[r].classList.contains("revealed")) continue;
        var caixa = reveais[r].getBoundingClientRect();
        if (caixa.top < window.innerHeight && caixa.bottom > 0) revelar(reveais[r]);
      }
    }

    var observador = new IntersectionObserver(function (entradas) {
      for (var i = 0; i < entradas.length; i++) {
        if (!entradas[i].isIntersecting) continue;
        revelar(entradas[i].target);
        observador.unobserve(entradas[i].target);
      }
    }, { threshold: 0.15 });

    for (var i = 0; i < reveais.length; i++) observador.observe(reveais[i]);

    // Rede de segurança: se o observador não disparar (navegadores antigos ou
    // situações excepcionais), o que já está na tela aparece mesmo assim
    setTimeout(revelarVisiveis, 1500);

    // Quem participa da entrada: os blocos e os realces (.mark) dentro deles,
    // que voltam a ser preenchidos junto (o contador se reinicia sozinho, por
    // estar dentro do bloco que ganha a classe de novo)
    var entradas = [];
    for (var r = 0; r < reveais.length; r++) {
      entradas.push(reveais[r]);
      var marcas = reveais[r].querySelectorAll(".mark");
      for (var j = 0; j < marcas.length; j++) entradas.push(marcas[j]);
    }

    // Recomeça a entrada dos blocos: tira a classe, devolve cada um ao
    // observador e revela o que está na tela
    function reiniciarReveais() {
      var n;
      for (n = 0; n < reveais.length; n++) {
        reveais[n].classList.remove("revealed");
        observador.observe(reveais[n]);
      }
      // sem transição enquanto o estado escondido é aplicado: se ela animasse
      // aqui, a revelação logo abaixo encontraria tudo já no lugar e nada
      // apareceria. A leitura de layout aplica esse estado antes de revelar
      for (n = 0; n < entradas.length; n++) entradas[n].style.transition = "none";
      void document.body.offsetHeight;
      for (n = 0; n < entradas.length; n++) entradas[n].style.transition = "";
      revelarVisiveis();
    }

    // O Quarto guarda o tema como classe no <body> (quarto-light/quarto-dark)
    function temaAgora() {
      if (document.documentElement.getAttribute("data-bs-theme") === "dark") return "dark";
      return document.body.classList.contains("quarto-dark") ? "dark" : "light";
    }

    var temaAnterior = temaAgora();
  
    // Anima o botão de tema a cada troca: as classes temporárias reativam os
    // keyframes do CSS (o indicador estica e o ícone que entra gira). Sem elas o
    // CSS só guardaria o estado final, sem a passagem de um lado ao outro
    var botaoTema = document.querySelector(".quarto-color-scheme-toggle");
    var timerTema = null;
    function animarBotaoTema(agora) {
      if (!botaoTema || reduzido) return;
      botaoTema.classList.remove("animating-to-dark", "animating-to-light");
      void botaoTema.offsetWidth; // reinicia os keyframes se um já estava ativo
      var classe = agora === "dark" ? "animating-to-dark" : "animating-to-light";
      botaoTema.classList.add(classe);
      clearTimeout(timerTema);
      timerTema = setTimeout(function () {
        botaoTema.classList.remove(classe);
      }, 600);
    }
  
    // A troca de tema não move nada, então o observador de tela não dispara e
    // os blocos ficariam revelados de uma vez só. Este é o único lugar que
    // reage à troca de fato e ignora as outras classes que o <body> recebe
    function aoMudarTema() {
      var agora = temaAgora();
      if (agora === temaAnterior) return;
      temaAnterior = agora;
      // reiniciarReveais força layout e pode travar a linha principal por um
      // instante; roda primeiro para a animação do botão começar limpa
      if (!reduzido) reiniciarReveais();
      animarBotaoTema(agora);
    }

    // Caminho normal: o Quarto anuncia a troca como classe no <body>/<html>
    if (typeof MutationObserver === "function") {
      var vigiaTema = new MutationObserver(aoMudarTema);
      vigiaTema.observe(document.body, { attributes: true, attributeFilter: ["class"] });
      vigiaTema.observe(document.documentElement, { attributes: true, attributeFilter: ["class", "data-bs-theme"] });
    }

    // Rede de segurança: o clique é a nossa garantia de que a animação roda
    // mesmo se o Quarto parar de anunciar a troca por atributo (o script dele
    // não é nosso, e sem aviso a animação sumiria sem erro nenhum). Como o
    // onclick inline já rodou quando este listener é chamado, o timeout deixa
    // as microtarefas do vigia resolverem antes: aqui só sobra o caso em que
    // ele não viu nada, então os dois caminhos nunca animam duas vezes
    if (botaoTema) {
      botaoTema.addEventListener("click", function () {
        setTimeout(aoMudarTema, 0);
      });
    }

    var carrosseis = document.querySelectorAll(".hscroll-wrap");
    for (var k = 0; k < carrosseis.length; k++) {
      (function (wrap) {
        var trilho = wrap.querySelector(".hscroll");
        var passo = function () {
          var carta = trilho.querySelector(".hs-card");
          return carta ? carta.getBoundingClientRect().width + 16 : 340;
        };
        wrap.querySelector(".hscroll-btn.prev").addEventListener("click", function () {
          trilho.scrollBy({ left: -passo(), behavior: reduzido ? "auto" : "smooth" });
        });
        wrap.querySelector(".hscroll-btn.next").addEventListener("click", function () {
          trilho.scrollBy({ left: passo(), behavior: reduzido ? "auto" : "smooth" });
        });
      })(carrosseis[k]);
    }

    // Sumário lateral com espião de rolagem: destaca no sumário a seção
    // atualmente visível (páginas com âncoras, como a de Pesquisa)
    var sumario = document.querySelector(".side-toc[data-spy]");
    if (sumario) {
      var linksSumario = sumario.querySelectorAll("a[href*='#']");
      var pares = [];
      for (var s = 0; s < linksSumario.length; s++) {
        var secao = document.getElementById(linksSumario[s].getAttribute("href").split("#")[1] || "");
        if (secao) pares.push([secao, linksSumario[s]]);
      }
      // rola na própria página, sem recarregar (scripts do Quarto às vezes
      // reescrevem âncoras como URLs completas)
      for (var c = 0; c < pares.length; c++) {
        (function (par) {
          par[1].addEventListener("click", function (evento) {
            evento.preventDefault();
            par[0].scrollIntoView({ behavior: reduzido ? "auto" : "smooth", block: "start" });
            history.replaceState(null, "", "#" + par[0].id);
          });
        })(pares[c]);
      }
      var espiao = new IntersectionObserver(function (entradas) {
        for (var e = 0; e < entradas.length; e++) {
          if (!entradas[e].isIntersecting) continue;
          for (var q = 0; q < pares.length; q++) {
            pares[q][1].classList.toggle("active", pares[q][0] === entradas[e].target);
          }
        }
      }, { rootMargin: "-20% 0px -70% 0px" });
      for (var pr = 0; pr < pares.length; pr++) espiao.observe(pares[pr][0]);
    }

    var comparadores = document.querySelectorAll(".compare");
    for (var m = 0; m < comparadores.length; m++) {
      (function (comp) {
        var controle = comp.querySelector(".compare-range");
        controle.addEventListener("input", function () {
          comp.style.setProperty("--cut", controle.value + "%");
        });
      })(comparadores[m]);
    }

    // Visualizador em tela cheia (lightbox) compartilhado pela galeria e pelas
    // figuras dos artigos. Recebe uma lista de {src, alt, caption} e o índice
    // inicial; as setas só aparecem quando há mais de um item. Callbacks
    // opcionais avisam o chamador ao trocar de item e ao fechar.
    var lightboxUnico = null;
    function obterLightbox() {
      if (lightboxUnico) {
        return lightboxUnico;
      }
        var seta = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>';
      var maisMenos = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">';
      var caixa = document.createElement("div");
      caixa.className = "lightbox";
      caixa.innerHTML =
        '<div class="lightbox-zoom">' +
          '<button class="lightbox-zbtn" data-zoom="out" aria-label="Diminuir zoom">' + maisMenos + '<path d="M5 12h14"/></svg></button>' +
          '<button class="lightbox-zbtn" data-zoom="in" aria-label="Aumentar zoom">' + maisMenos + '<path d="M12 5v14M5 12h14"/></svg></button>' +
        "</div>" +
        '<button class="lightbox-nav prev" aria-label="Anterior">' + seta + "</button>" +
        '<figure class="lightbox-figure"><img alt="">' +
        '<figcaption class="lightbox-caption"></figcaption></figure>' +
        '<button class="lightbox-nav next" aria-label="Próxima">' + seta + "</button>" +
        '<button class="lightbox-close" aria-label="Fechar">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>' +
        "</button>";
      document.body.appendChild(caixa);
      var img = caixa.querySelector("img");
      var figura = caixa.querySelector(".lightbox-figure");
      var legenda = caixa.querySelector(".lightbox-caption");
      var setaPrev = caixa.querySelector(".lightbox-nav.prev");
      var setaNext = caixa.querySelector(".lightbox-nav.next");
      var itens = [], idx = 0, aoFechar = null, aoTrocar = null;

      // Zoom da imagem ampliada: escala e deslocamento (pan) em pixels de tela.
      // A imagem amplia com a roda do mouse (em direção ao cursor), duplo clique
      // ou os botões +/−, e desloca-se arrastando quando ampliada.
      var escala = 1, deslocX = 0, deslocY = 0, arrastando = false, ax = 0, ay = 0;
      var ESCALA_MAX = 6;

      function aplicarZoom() {
        img.style.transform = "translate(" + deslocX + "px," + deslocY + "px) scale(" + escala + ")";
        img.style.cursor = escala > 1 ? (arrastando ? "grabbing" : "grab") : "zoom-in";
        caixa.classList.toggle("zoomed", escala > 1);
      }
      function limitarPan() {
        var maxX = Math.max(0, (img.offsetWidth * escala - window.innerWidth) / 2);
        var maxY = Math.max(0, (img.offsetHeight * escala - window.innerHeight) / 2);
        deslocX = Math.max(-maxX, Math.min(maxX, deslocX));
        deslocY = Math.max(-maxY, Math.min(maxY, deslocY));
      }
      function resetarZoom() { escala = 1; deslocX = 0; deslocY = 0; aplicarZoom(); }
      function ampliarPara(fator, cx, cy) {
        var nova = Math.max(1, Math.min(ESCALA_MAX, escala * fator));
        var k = nova / escala;
        var r = img.getBoundingClientRect();
        // mantém fixo, sob o cursor, o ponto da imagem enquanto a escala muda
        deslocX += (cx - (r.left + r.width / 2)) * (1 - k);
        deslocY += (cy - (r.top + r.height / 2)) * (1 - k);
        escala = nova;
        if (escala === 1) { deslocX = 0; deslocY = 0; }
        limitarPan();
        aplicarZoom();
      }

      figura.addEventListener("wheel", function (e) {
        e.preventDefault();
        ampliarPara(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX, e.clientY);
      }, { passive: false });

      figura.addEventListener("dblclick", function (e) {
        e.preventDefault();
        if (escala > 1) resetarZoom();
        else ampliarPara(2, e.clientX, e.clientY);
      });

      figura.addEventListener("pointerdown", function (e) {
        if (escala <= 1) return;
        arrastando = true; ax = e.clientX; ay = e.clientY;
        figura.setPointerCapture(e.pointerId);
        aplicarZoom();
        e.preventDefault();
      });
      figura.addEventListener("pointermove", function (e) {
        if (!arrastando) return;
        deslocX += e.clientX - ax; deslocY += e.clientY - ay;
        ax = e.clientX; ay = e.clientY;
        limitarPan(); aplicarZoom();
      });
      figura.addEventListener("pointerup", function () { arrastando = false; aplicarZoom(); });

      var botoesZoom = caixa.querySelectorAll(".lightbox-zbtn");
      for (var z = 0; z < botoesZoom.length; z++) {
        botoesZoom[z].addEventListener("click", function (e) {
          e.stopPropagation();
          var fator = this.getAttribute("data-zoom") === "in" ? 1.4 : 1 / 1.4;
          ampliarPara(fator, window.innerWidth / 2, window.innerHeight / 2);
        });
      }

      function render() {
        idx = (idx + itens.length) % itens.length;
        img.src = itens[idx].src;
        img.alt = itens[idx].alt || "";
        // caption já vem como HTML (texto simples escapado, ou figcaption
        // renderizada — inclui fórmulas do MathJax nas figuras dos artigos)
        legenda.innerHTML = itens[idx].caption || "";
        var varios = itens.length > 1;
        setaPrev.hidden = setaNext.hidden = !varios;
        resetarZoom();
        if (aoTrocar) aoTrocar(idx);
      }
      function ir(delta) { idx += delta; render(); }
      function fechar() {
        caixa.classList.remove("open");
        if (aoFechar) aoFechar();
      }

      setaPrev.addEventListener("click", function (e) { e.stopPropagation(); ir(-1); });
      setaNext.addEventListener("click", function (e) { e.stopPropagation(); ir(1); });
      caixa.querySelector(".lightbox-close").addEventListener("click", function (e) { e.stopPropagation(); fechar(); });
      figura.addEventListener("click", function (e) { e.stopPropagation(); });
      caixa.addEventListener("click", fechar);
      document.addEventListener("keydown", function (e) {
        if (!caixa.classList.contains("open")) return;
        if (e.key === "Escape") fechar();
        // as setas só navegam quando a imagem não está ampliada
        if (escala === 1 && itens.length > 1 && e.key === "ArrowLeft") ir(-1);
        if (escala === 1 && itens.length > 1 && e.key === "ArrowRight") ir(1);
        if (e.key === "+" || e.key === "=") ampliarPara(1.4, window.innerWidth / 2, window.innerHeight / 2);
        if (e.key === "-" || e.key === "_") ampliarPara(1 / 1.4, window.innerWidth / 2, window.innerHeight / 2);
      });

      lightboxUnico = {
        abrir: function (lista, indice, cbFechar, cbTrocar) {
          itens = lista;
          idx = indice || 0;
          aoFechar = cbFechar || null;
          aoTrocar = cbTrocar || null;
          render();
          caixa.classList.add("open");
        }
      };
      return lightboxUnico;
    }

    // Galeria: palco com passagem automática a cada 10s, legenda sobre a foto,
    // faixa de miniaturas em uma linha paginada por setas; clicar no palco
    // amplia no visualizador compartilhado
    var thumbs = document.querySelectorAll(".gallery-thumb");
    if (thumbs.length) {
      var INTERVALO = 10000;
      var atual = 0, cronometro = null, emLightbox = false;
      var palcoImg = document.querySelector(".gallery-stage-img");
      var palcoLegenda = document.querySelector(".gallery-stage-caption");
      var progresso = document.querySelector(".gallery-progress");
      var trilhoThumbs = document.querySelector(".gallery-thumbs");
      var faixa = document.querySelector(".gallery-strip");

      function legendaDe(indice) {
        return thumbs[indice].getAttribute("data-caption") || "";
      }
      function itensGaleria() {
        return Array.prototype.map.call(thumbs, function (t) {
          var i = t.querySelector("img");
          return { src: i.src, alt: i.alt, caption: escaparHtml(t.getAttribute("data-caption") || "") };
        });
      }

      function reiniciarProgresso() {
        progresso.classList.remove("run");
        void progresso.offsetWidth;
        if (!reduzido) progresso.classList.add("run");
      }

      function mostrar(indice) {
        atual = (indice + thumbs.length) % thumbs.length;
        var foto = thumbs[atual].querySelector("img");
        palcoImg.src = foto.src;
        palcoImg.alt = foto.alt;
        palcoLegenda.textContent = legendaDe(atual);
        for (var t = 0; t < thumbs.length; t++) {
          thumbs[t].classList.toggle("active", t === atual);
        }
        // mantém a miniatura ativa visível na faixa
        var alvo = thumbs[atual];
        if (alvo.offsetLeft < trilhoThumbs.scrollLeft ||
            alvo.offsetLeft + alvo.offsetWidth > trilhoThumbs.scrollLeft + trilhoThumbs.clientWidth) {
          trilhoThumbs.scrollTo({ left: alvo.offsetLeft - 10, behavior: reduzido ? "auto" : "smooth" });
        }
        reiniciarProgresso();
      }

      function pararAuto() {
        clearInterval(cronometro);
        cronometro = null;
        progresso.classList.remove("run");
      }

      function iniciarAuto() {
        if (reduzido || cronometro) return;
        cronometro = setInterval(function () { mostrar(atual + 1); }, INTERVALO);
        reiniciarProgresso();
      }

      // interações no palco: passar o mouse pausa; clicar amplia
      var palco = document.querySelector(".gallery-stage");
      palco.addEventListener("mouseenter", pararAuto);
      palco.addEventListener("mouseleave", function () {
        if (!emLightbox) iniciarAuto();
      });
      palco.addEventListener("click", function () {
        pararAuto();
        emLightbox = true;
        obterLightbox().abrir(itensGaleria(), atual,
          function () { emLightbox = false; mostrar(atual); iniciarAuto(); },
          function (i) { atual = i; });
      });

      for (var f = 0; f < thumbs.length; f++) {
        (function (indice) {
          thumbs[indice].addEventListener("click", function () {
            pararAuto();
            mostrar(indice);
            iniciarAuto();
          });
        })(f);
      }

      // setas da faixa: avançam ou voltam uma "página" de miniaturas
      faixa.querySelector(".hscroll-btn.prev").addEventListener("click", function () {
        trilhoThumbs.scrollBy({ left: -trilhoThumbs.clientWidth, behavior: reduzido ? "auto" : "smooth" });
      });
      faixa.querySelector(".hscroll-btn.next").addEventListener("click", function () {
        trilhoThumbs.scrollBy({ left: trilhoThumbs.clientWidth, behavior: reduzido ? "auto" : "smooth" });
      });

      mostrar(0);
      iniciarAuto();
    }

    // Figuras dos artigos: uma ocupa a largura toda, duas ficam lado a lado
    // (classe figs-1/figs-2); clicar amplia no mesmo visualizador da galeria.
    var blocosFig = document.querySelectorAll(".pub-figures");

    Array.prototype.forEach.call(blocosFig, function (bloco) {
      var figuras = bloco.querySelectorAll("img");
      bloco.classList.add(figuras.length === 1 ? "figs-1" : "figs-2");

      Array.prototype.forEach.call(figuras, function (im, i) {
        im.addEventListener("click", function () {
          var lista = Array.prototype.map.call(figuras, function (img2) {
            var fig = img2.closest("figure");
            var cap = fig ? fig.querySelector("figcaption") : null;
            return { src: img2.currentSrc || img2.src, alt: img2.alt, caption: cap ? cap.innerHTML : "" };
          });
          obterLightbox().abrir(lista, i);
        });
      });
    });
  });
</script>
