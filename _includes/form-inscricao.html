<script>
  // Envio do formulário de contato ("Contato" / "Contact").
  //
  // O site é estático, então quem recebe o POST é o aplicativo da web do Apps
  // Script (ver ferramentas/apps-script/), apontado em data-endpoint no próprio
  // formulário. O Apps Script não devolve resposta legível por CORS, então o
  // envio é feito com mode: no-cors e a confirmação na tela é "saiu", não
  // "chegou". Quem garante a chegada é o e-mail que o script manda.
  document.addEventListener("DOMContentLoaded", function () {
    var form = document.getElementById("join-form");
    if (!form) return;

    var status = form.querySelector(".join-status");
    var botao = form.querySelector(".join-submit");
    var honeypot = form.querySelector(".join-honeypot");
    var motivo = form.querySelector("#join-motivo");
    var blocoOutro = form.querySelector(".join-outro");
    var campoOutro = form.querySelector("#join-outro");
    var contador = form.querySelector(".join-contador");
    var abertoEm = Date.now();

    function mostrar(mensagem, tipo) {
      if (!status) return;
      status.textContent = mensagem;
      status.className = "join-status " + (tipo || "");
    }

    function texto(chave, padrao) {
      return form.getAttribute("data-" + chave) || padrao;
    }

    function opcaoAtual() {
      return motivo ? motivo.options[motivo.selectedIndex] : null;
    }

    function ehOutro() {
      var opcao = opcaoAtual();
      return !!opcao && opcao.hasAttribute("data-outro");
    }

    function motivoEscolhido() {
      var opcao = opcaoAtual();
      if (!opcao) return "";
      var rotulo = opcao.textContent.trim();
      if (ehOutro()) {
        var detalhe = campoOutro ? campoOutro.value.trim() : "";
        return detalhe ? rotulo + ": " + detalhe : rotulo;
      }
      return rotulo;
    }

    function atualizarContador() {
      if (!contador || !campoOutro) return;
      contador.textContent = campoOutro.value.length + "/" + campoOutro.maxLength;
    }

    // O campo do "Outro" só aparece quando essa opção é a escolhida; ao
    // escondê-lo o valor é limpo para não ir junto no envio.
    function atualizarOutro() {
      var ativo = ehOutro();
      if (blocoOutro) blocoOutro.hidden = !ativo;
      if (!ativo && campoOutro) campoOutro.value = "";
      atualizarContador();
    }

    if (motivo && window.gaiaCombo) window.gaiaCombo(motivo);
    if (motivo) {
      motivo.addEventListener("change", atualizarOutro);
      atualizarOutro();
    }
    if (campoOutro) campoOutro.addEventListener("input", atualizarContador);

    form.addEventListener("submit", function (evento) {
      evento.preventDefault();
      if (honeypot && honeypot.value) return;                        // robô
      if (Date.now() - abertoEm < 3000) {                             // rápido demais
        mostrar(texto("msg-rapido", "Confira os dados e envie de novo."), "erro");
        return;
      }
      if (ehOutro() && (!campoOutro || !campoOutro.value.trim())) {   // "Outro" sem texto
        mostrar(texto("msg-outro", "Diga em poucas palavras qual é o motivo."), "erro");
        if (campoOutro) campoOutro.focus();
        return;
      }

      var endpoint = (form.getAttribute("data-endpoint") || "").trim();
      if (!endpoint) {
        mostrar(texto("msg-erro", "Não foi possível enviar. Tente novamente mais tarde."), "erro");
        return;
      }

      var campoAnexo = form.querySelector("#join-anexo");
      var anexo = campoAnexo && campoAnexo.files && campoAnexo.files[0];

      // Limite de 10 MB (10 * 1024 * 1024 bytes)
      var LIMITE_BYTES = 10 * 1024 * 1024;
      if (anexo && anexo.size > LIMITE_BYTES) {
        mostrar(texto("msg-tamanho", "O arquivo deve ter no máximo 10 MB."), "erro");
        if (campoAnexo) campoAnexo.focus();
        return;
      }

      function enviar(arquivoBase64, arquivoNome, arquivoTipo) {
        var dados = {
          nome: (form.querySelector("#join-nome") && form.querySelector("#join-nome").value || "").trim(),
          email: (form.querySelector("#join-email") && form.querySelector("#join-email").value || "").trim(),
          motivo: motivoEscolhido(),
          mensagem: ((form.querySelector("#join-msg") || form.querySelector("#join-mensagem")) && (form.querySelector("#join-msg") || form.querySelector("#join-mensagem")).value || "").trim(),
          website: (honeypot && honeypot.value) || "",
          token: form.getAttribute("data-token") || "",
          pagina: location.pathname,
          idioma: form.getAttribute("data-idioma") || "pt",
          arquivoBase64: arquivoBase64 || "",
          arquivoNome: arquivoNome || "",
          arquivoTipo: arquivoTipo || ""
        };

        botao.disabled = true;
        mostrar(texto("msg-enviando", "Enviando..."), "enviando");

        fetch(endpoint, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(dados)
        })
          .then(function () {
            mostrar(texto("msg-ok", "Mensagem enviada. Responderemos por e-mail."), "ok");
            form.querySelectorAll("input, select, textarea, button").forEach(function (campo) {
              if (!campo.classList.contains("join-honeypot")) campo.disabled = true;
            });
          })
          .catch(function () {
            botao.disabled = false;
            mostrar(texto("msg-erro", "Não foi possível enviar. Tente novamente mais tarde."), "erro");
          });
      }

      if (anexo) {
        mostrar(texto("msg-lendo", "Preparando arquivo..."), "enviando");
        var leitor = new FileReader();
        leitor.onload = function () {
          var res = leitor.result || "";
          var base64 = res.indexOf(",") !== -1 ? res.split(",")[1] : res;
          enviar(base64, anexo.name, anexo.type);
        };
        leitor.onerror = function () {
          mostrar(texto("msg-erro-arquivo", "Não foi possível ler o arquivo selecionado."), "erro");
        };
        leitor.readAsDataURL(anexo);
      } else {
        enviar("", "", "");
      }
    });
  });
</script>
