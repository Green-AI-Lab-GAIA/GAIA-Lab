<script>
  // Exploradores das paginas de pesquisa: combinam mapas ja renderizados no
  // repositorio com graficos SVG interativos de proposito unico intercalados ao texto.
  document.addEventListener("DOMContentLoaded", function () {
    var reduzido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function preCarregar(url) {
      if (url) { var im = new Image(); im.src = url; }
    }

    // Scrubber trimestral
    var scrubbers = document.querySelectorAll("[data-scrub]");
    for (var s = 0; s < scrubbers.length; s++) {
      (function (raiz) {
        var base = raiz.getAttribute("data-base") || "";
        var extensao = raiz.getAttribute("data-ext") || ".webp";
        var quadros = (raiz.getAttribute("data-quarters") || "").split(",").filter(Boolean);
        if (!quadros.length) return;

        var img = raiz.querySelector(".scrub-img");
        var faixa = raiz.querySelector(".scrub-range");
        var selo = raiz.querySelector(".scrub-badge");
        var rotulo = raiz.querySelector(".scrub-label");
        var botao = raiz.querySelector(".scrub-play");
        var atual = quadros.length - 1;
        var temporizador = null;

        function url(i) { return base + quadros[i] + extensao; }

        function mostrar(i) {
          atual = (i + quadros.length) % quadros.length;
          img.src = url(atual);
          if (selo) selo.textContent = quadros[atual].replace("q", " Q");
          if (rotulo) rotulo.textContent = quadros[atual].replace("q", " Q");
          if (faixa && faixa.value !== String(atual)) faixa.value = String(atual);
          preCarregar(url((atual + 1) % quadros.length));
          preCarregar(url((atual - 1 + quadros.length) % quadros.length));
        }

        function parar() {
          if (temporizador) { clearInterval(temporizador); temporizador = null; }
          if (botao) {
            botao.textContent = "▶";
            botao.setAttribute("aria-label", raiz.getAttribute("data-play-label") || "Reproduzir");
          }
        }

        function tocar() {
          if (temporizador) { parar(); return; }
          if (botao) {
            botao.textContent = "❙❙";
            botao.setAttribute("aria-label", raiz.getAttribute("data-pause-label") || "Pausar");
          }
          temporizador = setInterval(function () { mostrar(atual + 1); }, 900);
        }

        if (faixa) {
          faixa.addEventListener("input", function () { parar(); mostrar(parseInt(faixa.value, 10)); });
        }
        if (botao) {
          if (reduzido) { botao.style.display = "none"; } else { botao.addEventListener("click", tocar); }
        }
        raiz.addEventListener("mouseleave", parar);

        img.src = url(atual);
        if (selo) selo.textContent = quadros[atual].replace("q", " Q");
        if (rotulo) rotulo.textContent = quadros[atual].replace("q", " Q");
        preCarregar(url(atual - 1 < 0 ? atual : atual - 1));
      })(scrubbers[s]);
    }

    // Seletor de camadas pre-renderizadas
    var exploradores = document.querySelectorAll("[data-explorer]");
    for (var e = 0; e < exploradores.length; e++) {
      (function (raiz) {
        var abas = raiz.querySelectorAll(".explorer-tab");
        var camadas = raiz.querySelectorAll(".explorer-stage img");
        var legenda = raiz.querySelector(".explorer-caption");
        var legendas = (raiz.getAttribute("data-captions") || "").split("|");

        function ativar(indice) {
          for (var i = 0; i < camadas.length; i++) {
            var ativa = i === indice;
            camadas[i].classList.toggle("is-active", ativa);
            if (ativa && !camadas[i].getAttribute("src")) {
              camadas[i].setAttribute("src", camadas[i].getAttribute("data-src"));
            }
          }
          for (var j = 0; j < abas.length; j++) {
            abas[j].setAttribute("aria-selected", j === indice ? "true" : "false");
          }
          if (legenda && legendas[indice]) legenda.textContent = legendas[indice];
          var proxima = camadas[(indice + 1) % camadas.length];
          if (proxima) preCarregar(proxima.getAttribute("data-src") || proxima.getAttribute("src"));
        }

        for (var k = 0; k < abas.length; k++) {
          (function (indice) {
            abas[k].addEventListener("click", function () { ativar(indice); });
          })(k);
        }
        ativar(0);
      })(exploradores[e]);
    }

    // Seletor generico de abas/paineis ([data-tab-group])
    var tabGroups = document.querySelectorAll("[data-tab-group]");
    for (var tg = 0; tg < tabGroups.length; tg++) {
      (function (group) {
        var btns = group.querySelectorAll("[data-tab-target]");
        var panes = group.querySelectorAll("[data-tab-pane]");
        btns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            var target = btn.getAttribute("data-tab-target");
            btns.forEach(function (b) {
              var active = b === btn;
              b.classList.toggle("is-active", active);
              b.setAttribute("aria-selected", active ? "true" : "false");
            });
            panes.forEach(function (p) {
              var active = p.getAttribute("data-tab-pane") === target;
              p.classList.toggle("is-active", active);
              p.hidden = !active;
            });
          });
        });
      })(tabGroups[tg]);
    }

    // Classificação de culturas por talhão (GAIA Lab vs referência)
    var cropExplorers = document.querySelectorAll("[data-crop-explorer]");
    for (var ce = 0; ce < cropExplorers.length; ce++) {
      (function (root) {
        var lang = root.getAttribute("data-lang") || "pt";
        var modeBtns = root.querySelectorAll("[data-crop-mode]");
        var filterBtns = root.querySelectorAll("[data-crop-filter]");
        var polygons = root.querySelectorAll(".parcel-poly");
        var detailTitle = root.querySelector("[data-parcel-title]");
        var detailMeta = root.querySelector("[data-parcel-meta]");
        var detailSar = root.querySelector("[data-parcel-sar]");
        var detailRef = root.querySelector("[data-parcel-ref]");

        var currentMode = "gaia";
        var currentFilter = "all";

        function updatePolygons() {
          polygons.forEach(function (poly) {
            var trueCrop = poly.getAttribute("data-true-crop");
            var refCrop = poly.getAttribute("data-ref-crop");
            var shownCrop = currentMode === "gaia" ? trueCrop : refCrop;
            poly.setAttribute("data-shown-crop", shownCrop);
            var mismatch = currentMode === "ref" && trueCrop !== refCrop;
            poly.classList.toggle("is-mismatch", mismatch);
            var dimmed = currentFilter !== "all" && trueCrop !== currentFilter;
            poly.classList.toggle("is-dimmed", dimmed);
          });
        }

        function selectParcel(poly) {
          polygons.forEach(function (p) { p.classList.remove("is-selected"); });
          poly.classList.add("is-selected");
          var id = poly.getAttribute("data-parcel-id");
          var area = poly.getAttribute("data-area");
          var cycle = poly.getAttribute("data-cycle") || "";
          var gaiaLabel = poly.getAttribute("data-gaia-label");
          var refLabel = poly.getAttribute("data-ref-label");
          var trueCrop = poly.getAttribute("data-true-crop");
          var refCrop = poly.getAttribute("data-ref-crop");
          if (detailTitle) {
            detailTitle.textContent = (lang === "en" ? "Plot " : "Talhão ") + id + " (" + area + " ha)";
          }
          if (detailMeta) detailMeta.textContent = cycle;
          if (detailSar) detailSar.textContent = gaiaLabel;
          if (detailRef) {
            detailRef.textContent = refLabel;
            detailRef.classList.toggle("is-error", trueCrop !== refCrop);
          }
        }

        modeBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            currentMode = btn.getAttribute("data-crop-mode");
            modeBtns.forEach(function (b) {
              var active = b === btn;
              b.classList.toggle("is-active", active);
              b.setAttribute("aria-pressed", active ? "true" : "false");
            });
            updatePolygons();
          });
        });

        filterBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            currentFilter = btn.getAttribute("data-crop-filter");
            filterBtns.forEach(function (b) {
              var active = b === btn;
              b.classList.toggle("is-active", active);
              b.setAttribute("aria-pressed", active ? "true" : "false");
            });
            updatePolygons();
          });
        });

        polygons.forEach(function (poly) {
          poly.addEventListener("click", function () { selectParcel(poly); });
        });

        updatePolygons();
        var initial = root.querySelector(".parcel-poly.is-selected") || polygons[0];
        if (initial) selectParcel(initial);
      })(cropExplorers[ce]);
    }

    // Detecção de fenologia e leitura de risco na vizinhança
    var phenoExplorers = document.querySelectorAll("[data-pheno-explorer]");
    for (var pe = 0; pe < phenoExplorers.length; pe++) {
      (function (root) {
        var btns = root.querySelectorAll("[data-pheno-mode]");
        var targetLine = root.querySelector(".pheno-target-line");
        var envArea = root.querySelector(".pheno-env-area");
        var envMean = root.querySelector(".pheno-env-mean");
        var sosGroup = root.querySelector(".pheno-markers-group");
        var neighbors = root.querySelectorAll(".neighbor-cell");
        var targetCell = root.querySelector(".neighbor-target-cell");
        var badge = root.querySelector("[data-pheno-badge]");
        var diagnosis = root.querySelector("[data-pheno-diagnosis]");
        var sosText = root.querySelector("[data-pheno-sos]");
        var posText = root.querySelector("[data-pheno-pos]");
        var eosText = root.querySelector("[data-pheno-eos]");

        var states = {
          safra: {
            target: "M 30,118 C 52,116 68,102 82,78 C 98,42 118,24 140,22 C 162,24 180,68 196,104 C 206,112 216,108 228,88 C 246,52 268,32 290,30 C 312,32 330,76 346,108 L 358,116",
            envArea: "M 30,114 C 52,112 68,96 82,70 C 98,34 118,18 140,16 C 162,18 180,60 196,96 C 206,104 216,100 228,80 C 246,44 268,24 290,22 C 312,24 330,68 346,100 L 358,110 L 358,122 L 346,116 C 330,86 312,42 290,40 C 268,42 246,62 228,96 C 216,114 206,118 196,112 C 180,76 162,34 140,32 C 118,34 98,52 82,86 C 68,108 52,120 30,122 Z",
            envMean: "M 30,118 C 52,116 68,102 82,78 C 98,42 118,24 140,22 C 162,24 180,68 196,104 C 206,112 216,108 228,88 C 246,52 268,32 290,30 C 312,32 330,76 346,108 L 358,116",
            showMarkers: true,
            targetState: "healthy",
            neighborState: "healthy",
            targetColor: "#365902"
          },
          operacional: {
            target: "M 30,118 C 52,116 68,102 82,78 C 98,42 118,24 140,22 C 162,24 180,68 196,104 C 206,112 216,108 228,95 C 246,84 268,88 290,96 C 312,104 330,112 346,116 L 358,118",
            envArea: "M 30,114 C 52,112 68,96 82,70 C 98,34 118,18 140,16 C 162,18 180,60 196,96 C 206,104 216,100 228,80 C 246,44 268,24 290,22 C 312,24 330,68 346,100 L 358,110 L 358,122 L 346,116 C 330,86 312,42 290,40 C 268,42 246,62 228,96 C 216,114 206,118 196,112 C 180,76 162,34 140,32 C 118,34 98,52 82,86 C 68,108 52,120 30,122 Z",
            envMean: "M 30,118 C 52,116 68,102 82,78 C 98,42 118,24 140,22 C 162,24 180,68 196,104 C 206,112 216,108 228,88 C 246,52 268,32 290,30 C 312,32 330,76 346,108 L 358,116",
            showMarkers: true,
            targetState: "stressed",
            neighborState: "healthy",
            targetColor: "#c85a32"
          },
          sistemico: {
            target: "M 30,118 C 52,116 68,102 82,78 C 98,42 118,24 140,22 C 162,24 180,68 196,104 C 206,112 216,108 228,94 C 246,78 268,74 290,82 C 312,92 330,108 346,115 L 358,118",
            envArea: "M 30,114 C 52,112 68,96 82,70 C 98,34 118,18 140,16 C 162,18 180,60 196,96 C 206,104 216,100 228,86 C 246,70 268,66 290,74 C 312,84 330,100 346,110 L 358,114 L 358,124 L 346,120 C 330,114 312,100 290,90 C 268,82 246,86 228,102 C 216,114 206,118 196,112 C 180,76 162,34 140,32 C 118,34 98,52 82,86 C 68,108 52,120 30,122 Z",
            envMean: "M 30,118 C 52,116 68,102 82,78 C 98,42 118,24 140,22 C 162,24 180,68 196,104 C 206,112 216,108 228,94 C 246,78 268,74 290,82 C 312,92 330,108 346,115 L 358,118",
            showMarkers: true,
            targetState: "stressed",
            neighborState: "stressed",
            targetColor: "#c85a32"
          }
        };

        btns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            var mode = btn.getAttribute("data-pheno-mode");
            var st = states[mode];
            if (!st) return;
            btns.forEach(function (b) {
              var active = b === btn;
              b.classList.toggle("is-active", active);
              b.setAttribute("aria-pressed", active ? "true" : "false");
            });
            if (targetLine) {
              targetLine.setAttribute("d", st.target);
              targetLine.setAttribute("stroke", st.targetColor);
            }
            if (envArea) envArea.setAttribute("d", st.envArea);
            if (envMean) envMean.setAttribute("d", st.envMean);
            if (sosGroup) sosGroup.style.opacity = st.showMarkers ? "1" : "0.35";
            if (targetCell) targetCell.setAttribute("data-health", st.targetState);
            neighbors.forEach(function (cell) {
              cell.setAttribute("data-health", st.neighborState);
            });
            if (badge) badge.textContent = btn.getAttribute("data-badge-text") || "";
            if (diagnosis) diagnosis.textContent = btn.getAttribute("data-diag-text") || "";
            if (sosText) sosText.textContent = btn.getAttribute("data-sos-label") || "";
            if (posText) posText.textContent = btn.getAttribute("data-pos-label") || "";
            if (eosText) eosText.textContent = btn.getAttribute("data-eos-label") || "";
          });
        });
      })(phenoExplorers[pe]);
    }

    // Simulador de estoque de macronutrientes NPK
    var npkSims = document.querySelectorAll("[data-npk-sim]");
    for (var ns = 0; ns < npkSims.length; ns++) {
      (function (root) {
        var lang = root.getAttribute("data-lang") || "pt";
        var cropBtns = root.querySelectorAll("[data-npk-crop]");
        var cutBtns = root.querySelectorAll("[data-npk-cut]");
        var soilBtns = root.querySelectorAll("[data-npk-soil]");
        var ruleBtns = root.querySelectorAll("[data-npk-rule]");

        var yieldLine = root.querySelector(".npk-yield-line");
        var stockLine = root.querySelector(".npk-stock-line");
        var yieldDots = root.querySelectorAll(".npk-yield-dot");
        var stockDots = root.querySelectorAll(".npk-stock-dot");
        var valEndYield = root.querySelector("[data-npk-end-yield]");
        var valEndStock = root.querySelector("[data-npk-end-stock]");
        var calloutText = root.querySelector("[data-npk-callout]");

        var state = {
          crop: "soja",
          cut: "N",
          soil: "alto",
          rule: "defensavel"
        };

        var baseProfiles = {
          soja: {
            N:   { alto: [100, 99, 99, 98, 98], baixo: [100, 98, 97, 96, 95], stockAlto: [100, 96, 93, 90, 88], stockBaixo: [65, 62, 59, 57, 55] },
            P:   { alto: [100, 99, 95, 88, 79], baixo: [100, 86, 74, 64, 56], stockAlto: [100, 82, 66, 52, 40], stockBaixo: [55, 38, 26, 18, 12] },
            NPK: { alto: [100, 98, 91, 80, 68], baixo: [100, 81, 65, 52, 43], stockAlto: [100, 78, 59, 44, 32], stockBaixo: [55, 34, 21, 14, 9] }
          },
          milho: {
            N:   { alto: [100, 94, 82, 68, 55], baixo: [100, 76, 58, 45, 36], stockAlto: [100, 74, 53, 38, 27], stockBaixo: [55, 32, 19, 12, 8] },
            P:   { alto: [100, 98, 92, 83, 73], baixo: [100, 84, 71, 60, 51], stockAlto: [100, 80, 63, 49, 38], stockBaixo: [55, 37, 25, 17, 11] },
            NPK: { alto: [100, 92, 76, 59, 45], baixo: [100, 70, 50, 36, 27], stockAlto: [100, 70, 48, 32, 21], stockBaixo: [55, 29, 16, 10, 6] }
          },
          algodao: {
            N:   { alto: [100, 95, 85, 73, 61], baixo: [100, 79, 63, 50, 40], stockAlto: [100, 77, 57, 42, 31], stockBaixo: [58, 35, 22, 14, 9] },
            P:   { alto: [100, 98, 93, 84, 75], baixo: [100, 86, 73, 62, 53], stockAlto: [100, 81, 65, 51, 39], stockBaixo: [58, 39, 27, 18, 12] },
            NPK: { alto: [100, 93, 79, 63, 49], baixo: [100, 73, 53, 39, 29], stockAlto: [100, 72, 50, 34, 23], stockBaixo: [58, 31, 18, 11, 7] }
          }
        };

        var xs = [45, 115, 185, 255, 325];
        function yCoord(val) {
          return Math.round(132 - (val / 100) * 110);
        }

        function explain(c, cut, soil, rule) {
          if (lang === "en") {
            if (c === "soja" && cut === "N") {
              return "Crop biology inside the model: cutting mineral nitrogen barely reduces Brazilian soybean yield because biological nitrogen fixation supplies nearly all the plant's demand. A model treating N, P, and K symmetrically would fail here.";
            }
            if (soil === "alto") {
              return "High-stock soil acts as a buffer: in the first seasons, plants draw on accumulated soil reserves before productivity drops sharply. Under the " + (rule === "pessimista" ? "pessimistic (multiplicative)" : "most defensible") + " combination rule, year-5 yield reaches " + valEndYield.textContent + ".";
            }
            return "Low-stock soil responds in the very first crop season: without accumulated reserves in the soil profile, cutting " + cut + " immediately translates into yield loss.";
          } else {
            if (c === "soja" && cut === "N") {
              return "Biologia da cultura no modelo: cortar nitrogênio mineral quase não derruba a produtividade da soja brasileira, pois a fixação biológica supre a maior parte da demanda da planta. Um modelo que tratasse N, P e K como insumos simétricos erraria essa resposta.";
            }
            if (soil === "alto") {
              return "Solo com estoque alto amortece o corte inicial: nas primeiras safras a planta consome a reserva acumulada no perfil antes de a produção cair com força. Pela regra " + (rule === "pessimista" ? "pessimista (multiplicativa)" : "mais defensável") + ", a produtividade no 5º ano chega a " + valEndYield.textContent + ".";
            }
            return "Solo pobre responde já na primeira safra: sem reserva acumulada no solo para amortecer a redução de adubo, o corte de " + cut + " derruba a produtividade imediatamente.";
          }
        }

        function renderNpk() {
          var prof = baseProfiles[state.crop][state.cut];
          var rawYield = state.soil === "alto" ? prof.alto.slice() : prof.baixo.slice();
          var rawStock = state.soil === "alto" ? prof.stockAlto.slice() : prof.stockBaixo.slice();

          if (state.rule === "pessimista" && state.cut === "NPK") {
            for (var i = 1; i < rawYield.length; i++) {
              rawYield[i] = Math.max(18, rawYield[i] - (i * 3));
            }
          }

          var yPts = rawYield.map(function (v, idx) { return xs[idx] + "," + yCoord(v); });
          var sPts = rawStock.map(function (v, idx) { return xs[idx] + "," + yCoord(v); });

          if (yieldLine) yieldLine.setAttribute("points", yPts.join(" "));
          if (stockLine) stockLine.setAttribute("points", sPts.join(" "));

          yieldDots.forEach(function (d, idx) {
            d.setAttribute("cx", xs[idx]);
            d.setAttribute("cy", yCoord(rawYield[idx]));
          });
          stockDots.forEach(function (d, idx) {
            d.setAttribute("cx", xs[idx]);
            d.setAttribute("cy", yCoord(rawStock[idx]));
          });

          if (valEndYield) valEndYield.textContent = rawYield[4] + "%";
          if (valEndStock) valEndStock.textContent = rawStock[4] + "%";
          if (calloutText) calloutText.textContent = explain(state.crop, state.cut, state.soil, state.rule);
        }

        function bindGroup(btns, attr, key) {
          btns.forEach(function (btn) {
            btn.addEventListener("click", function () {
              state[key] = btn.getAttribute(attr);
              btns.forEach(function (b) {
                var active = b === btn;
                b.classList.toggle("is-active", active);
                b.setAttribute("aria-pressed", active ? "true" : "false");
              });
              renderNpk();
            });
          });
        }

        bindGroup(cropBtns, "data-npk-crop", "crop");
        bindGroup(cutBtns, "data-npk-cut", "cut");
        bindGroup(soilBtns, "data-npk-soil", "soil");
        bindGroup(ruleBtns, "data-npk-rule", "rule");
        renderNpk();
      })(npkSims[ns]);
    }

    // Ameaças climáticas por trecho de linha (FGV CERI)
    var ceriExplorers = document.querySelectorAll("[data-ceri-explorer]");
    for (var ce2 = 0; ce2 < ceriExplorers.length; ce2++) {
      (function (root) {
        var threatBtns = root.querySelectorAll("[data-ceri-threat]");
        var scenBtns = root.querySelectorAll("[data-ceri-scen]");
        var segments = root.querySelectorAll(".grid-seg-bar");
        var segVals = root.querySelectorAll(".grid-seg-val");
        var titleEl = root.querySelector("[data-ceri-title]");
        var methodEl = root.querySelector("[data-ceri-method]");
        var indicatorEl = root.querySelector("[data-ceri-indicator]");

        var state = { threat: "ventos", scen: "ssp245" };

        var data = {
          ventos: {
            hist:   [28, 42, 35, 58, 49, 31],
            ssp245: [39, 58, 48, 76, 67, 44],
            ssp585: [52, 74, 63, 92, 84, 59]
          },
          tempestades: {
            hist:   [45, 52, 61, 48, 39, 34],
            ssp245: [62, 71, 82, 66, 54, 47],
            ssp585: [78, 88, 96, 81, 69, 61]
          },
          temperatura: {
            hist:   [32, 38, 44, 51, 47, 36],
            ssp245: [54, 63, 72, 81, 75, 58],
            ssp585: [76, 85, 93, 98, 91, 79]
          },
          incendios: {
            hist:   [22, 35, 64, 71, 48, 25],
            ssp245: [36, 54, 83, 89, 66, 38],
            ssp585: [51, 72, 95, 99, 84, 52]
          },
          chuva: {
            hist:   [48, 55, 39, 33, 58, 62],
            ssp245: [64, 73, 52, 45, 76, 81],
            ssp585: [82, 91, 68, 59, 92, 96]
          }
        };

        function updateCeri() {
          var activeBtn = root.querySelector('[data-ceri-threat="' + state.threat + '"]');
          if (activeBtn) {
            if (titleEl) titleEl.textContent = activeBtn.getAttribute("data-title") || "";
            if (methodEl) methodEl.textContent = activeBtn.getAttribute("data-method") || "";
            if (indicatorEl) indicatorEl.textContent = activeBtn.getAttribute("data-indicator") || "";
          }
          var vals = (data[state.threat] && data[state.threat][state.scen]) || [50, 50, 50, 50, 50, 50];
          segments.forEach(function (bar, idx) {
            var v = vals[idx] || 40;
            bar.style.height = v + "%";
            bar.setAttribute("data-level", v >= 75 ? "high" : (v >= 50 ? "med" : "low"));
            if (segVals[idx]) segVals[idx].textContent = v + "/100";
          });
        }

        threatBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.threat = btn.getAttribute("data-ceri-threat");
            threatBtns.forEach(function (b) {
              var active = b === btn;
              b.classList.toggle("is-active", active);
              b.setAttribute("aria-pressed", active ? "true" : "false");

    // Controle de zoom e arrasto (pan e zoom) para satélite
    function initPanZoomStage(viewport, stage, natW, natH, hudRoot) {
      var zoom = 1;
      var tx = 0;
      var ty = 0;
      var minZoom = 0.45;
      var maxZoom = 6.5;
      var zoomLabel = hudRoot ? hudRoot.querySelector("[data-cv-zoom-val]") : null;
      var btnIn = hudRoot ? hudRoot.querySelector("[data-cv-zoom-in]") : null;
      var btnOut = hudRoot ? hudRoot.querySelector("[data-cv-zoom-out]") : null;
      var btnFit = hudRoot ? hudRoot.querySelector("[data-cv-zoom-fit]") : null;

      function clampPan() {
        var vw = viewport.clientWidth || 600;
        var vh = viewport.clientHeight || 410;
        var sw = natW * zoom;
        var sh = natH * zoom;
        if (sw <= vw) {
          tx = (vw - sw) / 2;
        } else {
          tx = Math.min(20, Math.max(vw - sw - 20, tx));
        }
        if (sh <= vh) {
          ty = (vh - sh) / 2;
        } else {
          ty = Math.min(20, Math.max(vh - sh - 20, ty));
        }
      }

      function applyTransform() {
        clampPan();
        stage.style.transform = "translate3d(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px,0) scale(" + zoom.toFixed(4) + ")";
        stage.classList.toggle("is-pixelated", zoom >= 2.2);
        if (zoomLabel) zoomLabel.textContent = Math.round(zoom * 100) + "%";
      }

      function fitToViewport(initialFocus) {
        var vw = viewport.clientWidth || 600;
        var vh = viewport.clientHeight || 410;
        minZoom = Math.max(vw / natW, vh / natH) * 0.92;
        if (initialFocus) {
          zoom = Math.max(minZoom, 0.88);
          tx = (vw / 2) - (natW * 0.48) * zoom;
          ty = (vh / 2) - (natH * 0.48) * zoom;
        } else {
          zoom = Math.max(vw / natW, vh / natH);
          tx = (vw - natW * zoom) / 2;
          ty = (vh - natH * zoom) / 2;
        }
        applyTransform();
      }

      function zoomAt(factor, clientX, clientY) {
        var rect = viewport.getBoundingClientRect();
        var px = clientX !== undefined ? (clientX - rect.left) : (rect.width / 2);
        var py = clientY !== undefined ? (clientY - rect.top) : (rect.height / 2);
        var wx = (px - tx) / zoom;
        var wy = (py - ty) / zoom;
        var nextZoom = Math.min(maxZoom, Math.max(minZoom, zoom * factor));
        zoom = nextZoom;
        tx = px - wx * zoom;
        ty = py - wy * zoom;
        applyTransform();
      }

      function centerOnPoint(wx, wy, targetZoom) {
        var vw = viewport.clientWidth || 600;
        var vh = viewport.clientHeight || 410;
        if (targetZoom) zoom = Math.min(maxZoom, Math.max(minZoom, targetZoom));
        tx = (vw / 2) - wx * zoom;
        ty = (vh / 2) - wy * zoom;
        applyTransform();
      }

      viewport.addEventListener("wheel", function (e) {
        e.preventDefault();
        var factor = e.deltaY < 0 ? 1.18 : (1 / 1.18);
        zoomAt(factor, e.clientX, e.clientY);
      }, { passive: false });

      var isDown = false;
      var moved = false;
      var startX = 0;
      var startY = 0;
      var origTx = 0;
      var origTy = 0;
      var rafId = null;

      viewport.addEventListener("pointerdown", function (e) {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        if (e.target.closest && e.target.closest(".cv-sat-hud")) return;
        isDown = true;
        moved = false;
        startX = e.clientX;
        startY = e.clientY;
        origTx = tx;
        origTy = ty;
        viewport.classList.add("is-dragging");
      });

      window.addEventListener("pointermove", function (e) {
        if (!isDown) return;
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        tx = origTx + dx;
        ty = origTy + dy;
        if (!rafId) {
          rafId = requestAnimationFrame(function () {
            applyTransform();
            rafId = null;
          });
        }
      });

      function stopDrag() {
        if (!isDown) return;
        isDown = false;
        viewport.classList.remove("is-dragging");
      }
      window.addEventListener("pointerup", stopDrag);
      window.addEventListener("pointercancel", stopDrag);

      if (btnIn) btnIn.addEventListener("click", function () { zoomAt(1.32); });
      if (btnOut) btnOut.addEventListener("click", function () { zoomAt(1 / 1.32); });
      if (btnFit) btnFit.addEventListener("click", function () { fitToViewport(false); });

      window.addEventListener("resize", function () { applyTransform(); });
      setTimeout(function () { fitToViewport(true); }, 30);

      return {
        wasDragged: function () { return moved; },
        centerOn: centerOnPoint,
        fit: fitToViewport
      };
    }

            activePlotLabel.textContent = (lang === "en" ? "Plot " : "Talhão ") + selectedPlot.id + " (" + aFmt + " ha · " + cropNames[lang][selectedPlot.crop] + ")";
          }

          // Data de foco padrão
          var defaultIdx = ivState.hoverIdx;
          if (defaultIdx < 0) {
            defaultIdx = 4;
            for (var k = 0; k < n; k++) {
              if (clearPct[k] <= 50 && (ser.smooth[k] - ser.raw[k] > 0.14)) {
                defaultIdx = k;
                break;
              }
            }
          }
          updateIvInspector(defaultIdx);
        }

        function updateIvInspector(idx) {
          if (!ivExplorer || !dataset || !selectedPlot) return;
          var idxName = ivState.indexName;
          var ser = selectedPlot.series[idxName] || selectedPlot.series.NDVI;
          var dStr = dataset.dates[idx] || "";
          var rawVal = ser.raw[idx];
          var smVal = ser.smooth[idx];
          var clr = selectedPlot.clear_pct[idx];
          var isDrop = (clr <= 60 && Math.abs(smVal - rawVal) > 0.11) || (smVal - rawVal > 0.16);

          var elDate = ivExplorer.querySelector("[data-iv-insp-date]");
          var elRaw = ivExplorer.querySelector("[data-iv-insp-raw]");
          var elSmooth = ivExplorer.querySelector("[data-iv-insp-smooth]");
          var elClear = ivExplorer.querySelector("[data-iv-insp-clear]");
          var elStatus = ivExplorer.querySelector("[data-iv-insp-status]");

          if (elDate) elDate.textContent = dStr;
          if (elRaw) elRaw.textContent = rawVal.toFixed(3);
          if (elSmooth) elSmooth.textContent = smVal.toFixed(3);
          if (elClear) elClear.textContent = clr + "%";
          if (elStatus) {
            if (isDrop) {
              elStatus.textContent = lang === "en"
                ? "Residual cloud detected (low clear-sky coverage): spurious drop discarded before reconstructing the continuous curve."
                : "Nuvem residual detectada (baixa cobertura limpa): queda espúria descartada pelo filtro antes da reconstrução da curva.";
            } else {
              elStatus.textContent = lang === "en"
                ? "Valid satellite pass: clear-sky reflectance preserved in the penalized temporal smoothing."
                : "Passagem limpa validada: observação preservada na reconstrução contínua do índice espectral.";
            }
          }
        }

        // Carrega dados de talhões e séries temporais de Campo Verde
        fetch(jsonUrl)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            dataset = data;
            if (svgGroup && dataset.plots) {
              svgGroup.innerHTML = "";
              dataset.plots.forEach(function (p) {
                var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("class", "cv-plot-path");
                path.setAttribute("d", p.path);
                path.setAttribute("data-fid", p.fid);
                path.addEventListener("click", function (e) {
                  if (pzInstance && pzInstance.wasDragged()) return;
                  e.stopPropagation();
                  selectPlotByFid(p.fid, false);
                });
                svgGroup.appendChild(path);
                pathElementsById[p.fid] = path;
              });
            }
            selectPlotByFid("3622_5102678", false);
          })
          .catch(function () {});
      })();
    }

    // Visualizador de Floresta (Campo Verde, MT)
    var forestViewers = document.querySelectorAll("[data-cv-forest-viewer]");
    for (var fv = 0; fv < forestViewers.length; fv++) {
      (function (root) {
        var viewport = root.querySelector(".cv-sat-viewport");
        var stage = root.querySelector(".cv-sat-stage");
        if (!viewport || !stage) return;
        initPanZoomStage(viewport, stage, 1400, 880, root);

        var baseImg = root.querySelector("[data-cv-f-base]");
        var predImg = root.querySelector('[data-cv-f-layer="pred"]');
        var badgeEl = root.querySelector("[data-cv-sat-badge]");
        var qBtns = root.querySelectorAll("[data-cv-f-quarter]");
        var clipBtns = root.querySelectorAll("[data-cv-f-clip]");
        var layBtns = root.querySelectorAll("[data-cv-f-toggle]");
        var opSlider = root.querySelector("[data-cv-f-opacity]");
        var opVal = root.querySelector("[data-cv-f-opacity-val]");

        var fState = {
          quarter: "2023q3",
          clip: "completo",
          opacity: 0.78
        };

        function syncForestLayers() {
          if (baseImg) baseImg.src = "images/floresta/cv-rgb-" + fState.quarter + ".webp";
          if (predImg) {
            if (fState.clip === "car" && fState.quarter === "2023q3") {
              predImg.src = "images/floresta/cv-pred-car-2023q3.webp";
            } else {
              predImg.src = "images/floresta/cv-pred-completo-" + fState.quarter + ".webp";
            }
            predImg.style.opacity = String(fState.opacity);
          }
          var incImg = root.querySelector('[data-cv-f-layer="incerteza"]');
          if (incImg) incImg.style.opacity = String(fState.opacity);
          var rotImg = root.querySelector('[data-cv-f-layer="rotulo"]');
          if (rotImg) rotImg.style.opacity = String(fState.opacity);
        }

        qBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            fState.quarter = btn.getAttribute("data-cv-f-quarter");
            qBtns.forEach(function (b) {
              var act = b === btn;
              b.classList.toggle("is-active", act);
              b.setAttribute("aria-pressed", act ? "true" : "false");
            });
            if (badgeEl) badgeEl.textContent = btn.getAttribute("data-badge") || fState.quarter.toUpperCase();
            syncForestLayers();
          });
        });

        clipBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            fState.clip = btn.getAttribute("data-cv-f-clip");
            clipBtns.forEach(function (b) {
              var act = b === btn;
              b.classList.toggle("is-active", act);
              b.setAttribute("aria-pressed", act ? "true" : "false");
            });
            syncForestLayers();
          });
        });

        layBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            var lay = btn.getAttribute("data-cv-f-toggle");
            var isOn = btn.classList.toggle("is-active");
            btn.setAttribute("aria-pressed", isOn ? "true" : "false");
            var imgEl = root.querySelector('[data-cv-f-layer="' + lay + '"]');
            if (imgEl) imgEl.classList.toggle("is-hidden", !isOn);
          });
        });

        if (opSlider) {
          opSlider.addEventListener("input", function () {
            fState.opacity = parseInt(opSlider.value, 10) / 100;
            if (opVal) opVal.textContent = opSlider.value + "%";
            syncForestLayers();
          });
        }

        syncForestLayers();
      })(forestViewers[fv]);
    }
  });
</script>
