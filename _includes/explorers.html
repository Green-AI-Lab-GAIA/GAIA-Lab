<script>
  // Exploradores das paginas de pesquisa: combinam mapas ja renderizados no
  // repositorio com graficos SVG interativos de proposito unico intercalados ao texto.
  document.addEventListener("DOMContentLoaded", function () {
    var reduzido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function preCarregar(url) {
      if (url) { var im = new Image(); im.src = url; }
    }

    // Scrubber trimestral
    var scrubbers = document.querySelectorAll("[data-scrub]");
    for (var s = 0; s < scrubbers.length; s++) {
      (function (raiz) {
        var base = raiz.getAttribute("data-base") || "";
        var extensao = raiz.getAttribute("data-ext") || ".webp";
        var quadros = (raiz.getAttribute("data-quarters") || "").split(",").filter(Boolean);
        if (!quadros.length) return;

        var img = raiz.querySelector(".scrub-img");
        var faixa = raiz.querySelector(".scrub-range");
        var selo = raiz.querySelector(".scrub-badge");
        var rotulo = raiz.querySelector(".scrub-label");
        var botao = raiz.querySelector(".scrub-play");
        var atual = quadros.length - 1;
        var temporizador = null;

        function url(i) { return base + quadros[i] + extensao; }

        function mostrar(i) {
          atual = (i + quadros.length) % quadros.length;
          img.src = url(atual);
          if (selo) selo.textContent = quadros[atual].replace("q", " Q");
          if (rotulo) rotulo.textContent = quadros[atual].replace("q", " Q");
          if (faixa && faixa.value !== String(atual)) faixa.value = String(atual);
          preCarregar(url((atual + 1) % quadros.length));
          preCarregar(url((atual - 1 + quadros.length) % quadros.length));
        }

        function parar() {
          if (temporizador) { clearInterval(temporizador); temporizador = null; }
          if (botao) {
            botao.textContent = "▶";
            botao.setAttribute("aria-label", raiz.getAttribute("data-play-label") || "Reproduzir");
          }
        }

        function tocar() {
          if (temporizador) { parar(); return; }
          if (botao) {
            botao.textContent = "❙❙";
            botao.setAttribute("aria-label", raiz.getAttribute("data-pause-label") || "Pausar");
          }
          temporizador = setInterval(function () { mostrar(atual + 1); }, 900);
        }

        if (faixa) {
          faixa.addEventListener("input", function () { parar(); mostrar(parseInt(faixa.value, 10)); });
        }
        if (botao) {
          if (reduzido) { botao.style.display = "none"; } else { botao.addEventListener("click", tocar); }
        }
        raiz.addEventListener("mouseleave", parar);

        img.src = url(atual);
        if (selo) selo.textContent = quadros[atual].replace("q", " Q");
        if (rotulo) rotulo.textContent = quadros[atual].replace("q", " Q");
        preCarregar(url(atual - 1 < 0 ? atual : atual - 1));
      })(scrubbers[s]);
    }

    // Seletor de camadas pre-renderizadas
    var exploradores = document.querySelectorAll("[data-explorer]");
    for (var e = 0; e < exploradores.length; e++) {
      (function (raiz) {
        var abas = raiz.querySelectorAll(".explorer-tab");
        var camadas = raiz.querySelectorAll(".explorer-stage img");
        var legenda = raiz.querySelector(".explorer-caption");
        var legendas = (raiz.getAttribute("data-captions") || "").split("|");

        function ativar(indice) {
          for (var i = 0; i < camadas.length; i++) {
            var ativa = i === indice;
            camadas[i].classList.toggle("is-active", ativa);
            if (ativa && !camadas[i].getAttribute("src")) {
              camadas[i].setAttribute("src", camadas[i].getAttribute("data-src"));
            }
          }
          for (var j = 0; j < abas.length; j++) {
            abas[j].setAttribute("aria-selected", j === indice ? "true" : "false");
          }
          if (legenda && legendas[indice]) legenda.textContent = legendas[indice];
          var proxima = camadas[(indice + 1) % camadas.length];
          if (proxima) preCarregar(proxima.getAttribute("data-src") || proxima.getAttribute("src"));
        }

        for (var k = 0; k < abas.length; k++) {
          (function (indice) {
            abas[k].addEventListener("click", function () { ativar(indice); });
          })(k);
        }
        ativar(0);
      })(exploradores[e]);
    }

    // Seletor generico de abas/paineis ([data-tab-group])
    var tabGroups = document.querySelectorAll("[data-tab-group]");
    for (var tg = 0; tg < tabGroups.length; tg++) {
      (function (group) {
        var btns = group.querySelectorAll("[data-tab-target]");
        var panes = group.querySelectorAll("[data-tab-pane]");
        btns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            var target = btn.getAttribute("data-tab-target");
            btns.forEach(function (b) {
              var active = b === btn;
              b.classList.toggle("is-active", active);
              b.setAttribute("aria-selected", active ? "true" : "false");
            });
            panes.forEach(function (p) {
              var active = p.getAttribute("data-tab-pane") === target;
              p.classList.toggle("is-active", active);
              p.hidden = !active;
            });
          });
        });
      })(tabGroups[tg]);
    }

    // Classificação de culturas por talhão (GAIA Lab vs referência)
    var cropExplorers = document.querySelectorAll("[data-crop-explorer]");
    for (var ce = 0; ce < cropExplorers.length; ce++) {
      (function (root) {
        var lang = root.getAttribute("data-lang") || "pt";
        var modeBtns = root.querySelectorAll("[data-crop-mode]");
        var filterBtns = root.querySelectorAll("[data-crop-filter]");
        var polygons = root.querySelectorAll(".parcel-poly");
        var detailTitle = root.querySelector("[data-parcel-title]");
        var detailMeta = root.querySelector("[data-parcel-meta]");
        var detailSar = root.querySelector("[data-parcel-sar]");
        var detailRef = root.querySelector("[data-parcel-ref]");

        var currentMode = "gaia";
        var currentFilter = "all";

        function updatePolygons() {
          polygons.forEach(function (poly) {
            var trueCrop = poly.getAttribute("data-true-crop");
            var refCrop = poly.getAttribute("data-ref-crop");
            var shownCrop = currentMode === "gaia" ? trueCrop : refCrop;
            poly.setAttribute("data-shown-crop", shownCrop);
            var mismatch = currentMode === "ref" && trueCrop !== refCrop;
            poly.classList.toggle("is-mismatch", mismatch);
            var dimmed = currentFilter !== "all" && trueCrop !== currentFilter;
            poly.classList.toggle("is-dimmed", dimmed);
          });
        }

        function selectParcel(poly) {
          polygons.forEach(function (p) { p.classList.remove("is-selected"); });
          poly.classList.add("is-selected");
          var id = poly.getAttribute("data-parcel-id");
          var area = poly.getAttribute("data-area");
          var cycle = poly.getAttribute("data-cycle") || "";
          var gaiaLabel = poly.getAttribute("data-gaia-label");
          var refLabel = poly.getAttribute("data-ref-label");
          var trueCrop = poly.getAttribute("data-true-crop");
          var refCrop = poly.getAttribute("data-ref-crop");
          if (detailTitle) {
            detailTitle.textContent = (lang === "en" ? "Plot " : "Talhão ") + id + " (" + area + " ha)";
          }
          if (detailMeta) detailMeta.textContent = cycle;
          if (detailSar) detailSar.textContent = gaiaLabel;
          if (detailRef) {
            detailRef.textContent = refLabel;
            detailRef.classList.toggle("is-error", trueCrop !== refCrop);
          }
        }

        modeBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            currentMode = btn.getAttribute("data-crop-mode");
            modeBtns.forEach(function (b) {
              var active = b === btn;
              b.classList.toggle("is-active", active);
              b.setAttribute("aria-pressed", active ? "true" : "false");
            });
            updatePolygons();
          });
        });

        filterBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            currentFilter = btn.getAttribute("data-crop-filter");
            filterBtns.forEach(function (b) {
              var active = b === btn;
              b.classList.toggle("is-active", active);
              b.setAttribute("aria-pressed", active ? "true" : "false");
            });
            updatePolygons();
          });
        });

        polygons.forEach(function (poly) {
          poly.addEventListener("click", function () { selectParcel(poly); });
        });

        updatePolygons();
        var initial = root.querySelector(".parcel-poly.is-selected") || polygons[0];
        if (initial) selectParcel(initial);
      })(cropExplorers[ce]);
    }

    // Ameaças climáticas por trecho de linha (FGV CERI)
    var ceriExplorers = document.querySelectorAll("[data-ceri-explorer]");
    for (var ce2 = 0; ce2 < ceriExplorers.length; ce2++) {
      (function (root) {
        var threatBtns = root.querySelectorAll("[data-ceri-threat]");
        var scenBtns = root.querySelectorAll("[data-ceri-scen]");
        var segments = root.querySelectorAll(".grid-seg-bar");
        var segVals = root.querySelectorAll(".grid-seg-val");
        var titleEl = root.querySelector("[data-ceri-title]");
        var methodEl = root.querySelector("[data-ceri-method]");
        var indicatorEl = root.querySelector("[data-ceri-indicator]");

        var state = { threat: "ventos", scen: "ssp245" };

        var data = {
          ventos: {
            hist:   [28, 42, 35, 58, 49, 31],
            ssp245: [39, 58, 48, 76, 67, 44],
            ssp585: [52, 74, 63, 92, 84, 59]
          },
          tempestades: {
            hist:   [45, 52, 61, 48, 39, 34],
            ssp245: [62, 71, 82, 66, 54, 47],
            ssp585: [78, 88, 96, 81, 69, 61]
          },
          temperatura: {
            hist:   [32, 38, 44, 51, 47, 36],
            ssp245: [54, 63, 72, 81, 75, 58],
            ssp585: [76, 85, 93, 98, 91, 79]
          },
          incendios: {
            hist:   [22, 35, 64, 71, 48, 25],
            ssp245: [36, 54, 83, 89, 66, 38],
            ssp585: [51, 72, 95, 99, 84, 52]
          },
          chuva: {
            hist:   [48, 55, 39, 33, 58, 62],
            ssp245: [64, 73, 52, 45, 76, 81],
            ssp585: [82, 91, 68, 59, 92, 96]
          }
        };

        function updateCeri() {
          var activeBtn = root.querySelector('[data-ceri-threat="' + state.threat + '"]');
          if (activeBtn) {
            if (titleEl) titleEl.textContent = activeBtn.getAttribute("data-title") || "";
            if (methodEl) methodEl.textContent = activeBtn.getAttribute("data-method") || "";
            if (indicatorEl) indicatorEl.textContent = activeBtn.getAttribute("data-indicator") || "";
          }
          var vals = (data[state.threat] && data[state.threat][state.scen]) || [50, 50, 50, 50, 50, 50];
          segments.forEach(function (bar, idx) {
            var v = vals[idx] || 40;
            bar.style.height = v + "%";
            bar.setAttribute("data-level", v >= 75 ? "high" : (v >= 50 ? "med" : "low"));
            if (segVals[idx]) segVals[idx].textContent = v + "/100";
          });
        }

        threatBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.threat = btn.getAttribute("data-ceri-threat");
            threatBtns.forEach(function (b) {
              var active = b === btn;
              b.classList.toggle("is-active", active);
              b.setAttribute("aria-pressed", active ? "true" : "false");
            });
            updateCeri();
          });
        });

        scenBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.scen = btn.getAttribute("data-ceri-scen");
            scenBtns.forEach(function (b) {
              var active = b === btn;
              b.classList.toggle("is-active", active);
              b.setAttribute("aria-pressed", active ? "true" : "false");
            });
            updateCeri();
          });
        });

        updateCeri();
      })(ceriExplorers[ce2]);
    }

    // Controle de zoom e arrasto (pan e zoom) para satélite
    function initPanZoomStage(viewport, stage, natW, natH, hudRoot) {
      var zoom = 1;
      var tx = 0;
      var ty = 0;
      var minZoom = 0.45;
      var maxZoom = 6.5;
      var zoomLabel = hudRoot ? hudRoot.querySelector("[data-cv-zoom-val]") : null;
      var btnIn = hudRoot ? hudRoot.querySelector("[data-cv-zoom-in]") : null;
      var btnOut = hudRoot ? hudRoot.querySelector("[data-cv-zoom-out]") : null;
      var btnFit = hudRoot ? hudRoot.querySelector("[data-cv-zoom-fit]") : null;

      function clampPan() {
        var vw = viewport.clientWidth || 600;
        var vh = viewport.clientHeight || 410;
        var sw = natW * zoom;
        var sh = natH * zoom;
        if (sw <= vw) {
          tx = (vw - sw) / 2;
        } else {
          tx = Math.min(20, Math.max(vw - sw - 20, tx));
        }
        if (sh <= vh) {
          ty = (vh - sh) / 2;
        } else {
          ty = Math.min(20, Math.max(vh - sh - 20, ty));
        }
      }

      function applyTransform() {
        clampPan();
        stage.style.transform = "translate3d(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px,0) scale(" + zoom.toFixed(4) + ")";
        stage.classList.toggle("is-pixelated", zoom >= 2.2);
        if (zoomLabel) zoomLabel.textContent = Math.round(zoom * 100) + "%";
      }

      function fitToViewport(initialFocus) {
        var vw = viewport.clientWidth || 600;
        var vh = viewport.clientHeight || 410;
        minZoom = Math.max(vw / natW, vh / natH) * 0.92;
        if (initialFocus) {
          zoom = Math.max(minZoom, 0.88);
          tx = (vw / 2) - (natW * 0.48) * zoom;
          ty = (vh / 2) - (natH * 0.48) * zoom;
        } else {
          zoom = Math.max(vw / natW, vh / natH);
          tx = (vw - natW * zoom) / 2;
          ty = (vh - natH * zoom) / 2;
        }
        applyTransform();
      }

      function zoomAt(factor, clientX, clientY) {
        var rect = viewport.getBoundingClientRect();
        var px = clientX !== undefined ? (clientX - rect.left) : (rect.width / 2);
        var py = clientY !== undefined ? (clientY - rect.top) : (rect.height / 2);
        var wx = (px - tx) / zoom;
        var wy = (py - ty) / zoom;
        var nextZoom = Math.min(maxZoom, Math.max(minZoom, zoom * factor));
        zoom = nextZoom;
        tx = px - wx * zoom;
        ty = py - wy * zoom;
        applyTransform();
      }

      function centerOnPoint(wx, wy, targetZoom) {
        var vw = viewport.clientWidth || 600;
        var vh = viewport.clientHeight || 410;
        if (targetZoom) zoom = Math.min(maxZoom, Math.max(minZoom, targetZoom));
        tx = (vw / 2) - wx * zoom;
        ty = (vh / 2) - wy * zoom;
        applyTransform();
      }

      viewport.addEventListener("wheel", function (e) {
        e.preventDefault();
        var factor = e.deltaY < 0 ? 1.18 : (1 / 1.18);
        zoomAt(factor, e.clientX, e.clientY);
      }, { passive: false });

      var isDown = false;
      var moved = false;
      var startX = 0;
      var startY = 0;
      var origTx = 0;
      var origTy = 0;
      var rafId = null;

      viewport.addEventListener("pointerdown", function (e) {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        if (e.target.closest && e.target.closest(".cv-sat-hud")) return;
        isDown = true;
        moved = false;
        startX = e.clientX;
        startY = e.clientY;
        origTx = tx;
        origTy = ty;
        viewport.classList.add("is-dragging");
      });

      window.addEventListener("pointermove", function (e) {
        if (!isDown) return;
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        tx = origTx + dx;
        ty = origTy + dy;
        if (!rafId) {
          rafId = requestAnimationFrame(function () {
            applyTransform();
            rafId = null;
          });
        }
      });

      function stopDrag() {
        if (!isDown) return;
        isDown = false;
        viewport.classList.remove("is-dragging");
      }
      window.addEventListener("pointerup", stopDrag);
      window.addEventListener("pointercancel", stopDrag);

      if (btnIn) btnIn.addEventListener("click", function () { zoomAt(1.32); });
      if (btnOut) btnOut.addEventListener("click", function () { zoomAt(1 / 1.32); });
      if (btnFit) btnFit.addEventListener("click", function () { fitToViewport(false); });

      window.addEventListener("resize", function () { applyTransform(); });
      setTimeout(function () { fitToViewport(true); }, 30);

      return {
        wasDragged: function () { return moved; },
        centerOn: centerOnPoint,
        fit: fitToViewport
      };
    }

    // Visualizador de Agricultura (Campo Verde, MT): palco único com o mapa
    // MapLibre dos talhões reais por ano e as séries de índices de vegetação.
    // Na narrativa guiada ([data-cv-story]) cada passo aplica uma cena ao
    // palco; o último passo move o palco para a largura total e libera todos
    // os controles. As séries comparam até três índices de um talhão ou o
    // mesmo índice em até três talhões.
    var agroViewer = document.querySelector("[data-cv-agro-viewer]");
    if (agroViewer) {
      (function () {
        var lang = agroViewer.getAttribute("data-lang") || "pt";
        var base = agroViewer.getAttribute("data-base") || "data/agro";
        var story = document.querySelector("[data-cv-story]");
        var MAPLIBRE = "https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl";
        var ANOS = [2020, 2021, 2022, 2023, 2024, 2025];
        var MAX_SEL = 3;
        var reduzido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        var T = {
          pt: {
            plot: "Talhão", plotsCmp: "Talhões comparados", ha: "ha",
            classes: { 0: "Soja", 1: "Milho", 2: "Algodão", 3: "Outros", none: "Sem classificação" },
            abbr: { 0: "soja", 1: "milho", 2: "algodão", 3: "outros", none: "s/ classe" },
            diverg: " (divergente)", concord: " (concordante)", tiles2: "inferido em 2 tiles",
            s2: "Sentinel-2 cloudless", esri: "Esri World Imagery", plots: "talhões",
            noSeries: "Este talhão não tem série de índices em {ano}.",
            noIndex: "Selecione até três índices acima.",
            noPlots: "Clique em até três talhões no mapa para compará-los.",
            noData: "sem dado", above: "acima do P75", within: "entre P25 e P75", below: "abaixo do P25",
            stAbove: "nesta data o talhão está acima de três quartos dos talhões do município.",
            stWithin: "nesta data o talhão acompanha a metade central dos talhões do município.",
            stBelow: "nesta data o talhão está abaixo de três quartos dos talhões do município.",
            iIdx: "Índice", iPlot: "Talhão", iVal: "Valor do talhão", iMed: "Mediana municipal", iPos: "Posição na vizinhança",
            iSeasons: "1ª / 2ª safra (modelo)", peakOf: "Pico de {idx} no ano",
            median: "mediana", band: "faixa P25 a P75", remove: "remover da comparação", locate: "localizar no mapa",
            sos: "SOS", pos: "POS", eos: "EOS"
          },
          en: {
            plot: "Plot", plotsCmp: "Compared plots", ha: "ha",
            classes: { 0: "Soybean", 1: "Corn", 2: "Cotton", 3: "Other", none: "Unclassified" },
            abbr: { 0: "soy", 1: "corn", 2: "cotton", 3: "other", none: "no class" },
            diverg: " (mismatch)", concord: " (concordant)", tiles2: "inferred in 2 tiles",
            s2: "Sentinel-2 cloudless", esri: "Esri World Imagery", plots: "plots",
            noSeries: "This plot has no index series in {ano}.",
            noIndex: "Select up to three indices above.",
            noPlots: "Click up to three plots on the map to compare them.",
            noData: "no data", above: "above P75", within: "between P25 and P75", below: "below P25",
            stAbove: "on this date the plot is above three quarters of the municipality's plots.",
            stWithin: "on this date the plot tracks the central half of the municipality's plots.",
            stBelow: "on this date the plot is below three quarters of the municipality's plots.",
            iIdx: "Index", iPlot: "Plot", iVal: "Plot value", iMed: "Municipal median", iPos: "Position among neighbours",
            iSeasons: "1st / 2nd season (model)", peakOf: "{idx} peak in the year",
            median: "median", band: "P25 to P75 band", remove: "remove from comparison", locate: "locate on the map",
            sos: "SOS", pos: "POS", eos: "EOS"
          }
        }[lang];
        var MESES = lang === "en"
          ? ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
          : ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        var CORES = { 0: "#e4432f", 1: "#f26fa8", 2: "#3fbf4f", 3: "#8e5fd0", none: "#9fd6ef" };
        var RAMPA = ["#c46e34", "#dcba3e", "#1f8d3e"];
        // Cores das séries no modo "um índice em vários talhões": no gráfico e no contorno do mapa
        var SERIES = ["#d97706", "#0096c7", "#d6336c"];
        var SERIES_MAPA = ["#ffb703", "#48cae4", "#f06292"];
        var MARCOS = { sos: "#2b6cb0", pos: "#365902", eos: "#b7791f" };

        function fmt(v, casas) {
          if (v === null || v === undefined || isNaN(v)) return T.noData;
          var s = Number(v).toFixed(casas === undefined ? 3 : casas);
          return lang === "en" ? s : s.replace(".", ",");
        }
        function fmtInt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, lang === "en" ? "," : "."); }
        function className(code) { return (code === null || code === undefined) ? T.classes.none : T.classes[code]; }
        function abbr(code) { return (code === null || code === undefined) ? T.abbr.none : T.abbr[code]; }
        function numDe(fid) { return String(fid).split("_")[0]; }
        function q(sel) { return agroViewer.querySelector(sel); }
        function qa(sel) { return agroViewer.querySelectorAll(sel); }

        var state = {
          year: 2021, season: 1, mode: "gaia", crop: "all", opacity: 0.62, basemap: "s2",
          compare: "indices", indices: ["NDVI"], plotsSel: [],
          showBand: true, showMedian: true, markers: false,
          selected: null, hoverIdx: -1, locked: true
        };
        var plots = null;            // GeoJSON do ano
        var anoCarregado = null;
        var plotsByFid = {};
        var seriesByIdx = {};        // índice -> {ano, indice, datas, regional, talhoes}
        var seriesCache = {};
        var peaks = {};              // fid -> {v, i} do primeiro índice
        var peakRange = null;
        var municipio = null;
        var map = null;
        var mapPronto = false;
        var popup = null;
        var cenaAtual = null;        // cena aplicada pela narrativa
        var passoAtual = null;

        function primeiroIndice() { return state.indices[0] || null; }
        function indicesAtivos() { return state.compare === "plots" ? state.indices.slice(0, 1) : state.indices; }
        function serieDe(idx) { return seriesByIdx[idx] && seriesByIdx[idx].ano === state.year ? seriesByIdx[idx] : null; }
        function fidsSelecionados() {
          if (state.compare === "plots") return state.plotsSel.slice();
          return state.selected ? [state.selected] : [];
        }

        // Carregamento sob demanda do MapLibre (só na página que tem o mapa)
        function carregarMapLibre(cb) {
          if (window.maplibregl) { cb(); return; }

        function tilesS2(ano) {
          return ["https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-" + ano + "_3857/default/g/{z}/{y}/{x}.jpg"];
        }
        var ATTR_S2 = '<a href="https://s2maps.eu" target="_blank" rel="noopener">Sentinel-2 cloudless</a> by EOX IT Services GmbH (Contains modified Copernicus Sentinel data)';
        var ATTR_ESRI = "Esri, Maxar, Earthstar Geographics, GIS User Community";

        function corPorClasse(prop) {
          return ["match", ["coalesce", ["get", prop], -1],
            0, CORES[0], 1, CORES[1], 2, CORES[2], 3, CORES[3], CORES.none];
        }

        function expressaoDivergente() {
          var s = ["coalesce", ["get", "s" + state.season], -1];
          var m = ["coalesce", ["get", "mb" + state.season], -1];
          return ["all", ["!=", s, m], ["!=", s, -1], ["!=", m, -1]];
        }

        function aplicarEstilo() {
          atualizarLegenda();
          if (!mapPronto) return;
          var fill, op = state.opacity, line = "rgba(255,255,255,0.72)", lw = 0.9;
          if (state.mode === "gaia") {
            fill = corPorClasse("s" + state.season);
          } else if (state.mode === "ref") {
            fill = corPorClasse("mb" + state.season);
          } else if (state.mode === "diverg") {
            fill = ["case", expressaoDivergente(), corPorClasse("s" + state.season), "rgba(255,255,255,0.10)"];
            line = ["case", expressaoDivergente(), "#ff4d42", "rgba(255,255,255,0.45)"];
            lw = ["case", expressaoDivergente(), 1.6, 0.7];
          } else if (state.mode === "indice") {
            var lo = peakRange ? peakRange[0] : 0, hi = peakRange ? peakRange[1] : 1;
            var mid = (lo + hi) / 2;
            fill = ["case", ["==", ["coalesce", ["feature-state", "peak"], -99], -99], "rgba(255,255,255,0.10)",
              ["interpolate", ["linear"], ["feature-state", "peak"], lo, RAMPA[0], mid, RAMPA[1], hi, RAMPA[2]]];
            op = Math.max(0.7, state.opacity);
          } else {
            fill = "rgba(255,255,255,0.03)";
            op = 0.3;
            line = "rgba(255,255,255,0.9)";
            lw = 1.2;
          }
          var dim = state.crop === "all" ? ["literal", false]
            : ["!=", ["coalesce", ["get", "s" + state.season], -1], parseInt(state.crop, 10)];
          map.setPaintProperty("plots-fill", "fill-color", fill);
          map.setPaintProperty("plots-fill", "fill-opacity", ["case", dim, 0.08, op]);
          map.setPaintProperty("plots-line", "line-color", line);
          map.setPaintProperty("plots-line", "line-width", lw);
          map.setPaintProperty("plots-line", "line-opacity", ["case", dim, 0.25, 1]);
          aplicarSelecao();
        }

        // Contorno dos talhões selecionados: branco no modo índices, uma cor por talhão no modo talhões
        function aplicarSelecao() {
          if (!mapPronto) return;
          var fids = fidsSelecionados();
          if (!fids.length) { map.setFilter("plots-sel", ["==", ["get", "fid"], ""]); return; }
          map.setFilter("plots-sel", ["in", ["get", "fid"], ["literal", fids]]);
          var cor = "#ffffff";
          if (state.compare === "plots") {
            cor = ["match", ["get", "fid"]];
            fids.forEach(function (f, i) { cor.push(f, SERIES_MAPA[i]); });
            cor.push("#ffffff");
          }
          map.setPaintProperty("plots-sel", "line-color", cor);
        }

        // Legenda sobre o mapa, de acordo com o modo de cor e a comparação ativa
        function atualizarLegenda() {
          var legC = q("[data-cv-legend-classes]"), legI = q("[data-cv-legend-index]");
          var legO = q("[data-cv-legend-outline]"), legD = q("[data-cv-legend-div]"), legP = q("[data-cv-legend-plots]");
          if (legC) legC.hidden = state.mode === "indice" || state.mode === "outline";
          if (legD) legD.hidden = state.mode !== "diverg";
          if (legO) legO.hidden = state.mode !== "outline";
          if (legI) {
            legI.hidden = state.mode !== "indice";
            var nm = legI.querySelector("[data-cv-legend-index-name]");
            var lo2 = legI.querySelector("[data-cv-legend-index-lo]");
            var hi2 = legI.querySelector("[data-cv-legend-index-hi]");
            if (nm) nm.textContent = primeiroIndice() || "";
            if (lo2) lo2.textContent = peakRange ? fmt(peakRange[0], 2) : T.noData;
            if (hi2) hi2.textContent = peakRange ? fmt(peakRange[1], 2) : T.noData;
          }
          if (legP) {
            var fids = state.compare === "plots" ? state.plotsSel : [];
            legP.hidden = !fids.length;
            legP.innerHTML = "";
            fids.forEach(function (f, i) {
              var p = plotsByFid[f] && plotsByFid[f].properties;
              var sp = document.createElement("span");
              sp.className = "cv-map-legend-item";
              var sw = document.createElement("i");
              sw.className = "cv-map-swatch";
              sw.style.cssText = "border:2px solid " + SERIES_MAPA[i] + "; background:transparent";
              sp.appendChild(sw);
              sp.appendChild(document.createTextNode("#" + numDe(f) + (p ? " · " + abbr(p.s1) + "/" + abbr(p.s2) : "")));
              legP.appendChild(sp);
            });
          }
        }

        function atualizarBadge() {
          var b = q("[data-cv-sat-badge]");
          if (!b) return;
          var fundo = state.basemap === "s2" ? T.s2 + " " + state.year : T.esri;
          b.textContent = fundo + (plots ? " · " + fmtInt(plots.features.length) + " " + T.plots : "");
        }

        function bboxDe(geom) {
          var b = [Infinity, Infinity, -Infinity, -Infinity];
          function visita(c) {
            if (typeof c[0] === "number") {
              if (c[0] < b[0]) b[0] = c[0];
              if (c[1] < b[1]) b[1] = c[1];
              if (c[0] > b[2]) b[2] = c[0];
              if (c[1] > b[3]) b[3] = c[1];
            } else c.forEach(visita);
          }
          visita(geom.coordinates);
          return b;
        }
        function unirBbox(a, b) {
          return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])];
        }
        function dur(ms) { return reduzido ? 0 : ms; }

        function ajustarMunicipio() {
          if (!map || !municipio) return;
          map.resize();
          map.fitBounds(bboxDe(municipio.features[0].geometry), { padding: 24, duration: dur(600) });
        }

        function centrarNoTalhao(fid) {
          fid = fid || state.selected;
          if (!map || !fid || !plotsByFid[fid]) return;
          map.resize();
          map.fitBounds(bboxDe(plotsByFid[fid].geometry), { padding: 80, maxZoom: 14.5, duration: dur(700) });
        }

        function centrarNosTalhoes(fids) {
          var caixas = fids.filter(function (f) { return plotsByFid[f]; }).map(function (f) { return bboxDe(plotsByFid[f].geometry); });
          if (!map || !caixas.length) return;
          map.resize();
          map.fitBounds(caixas.reduce(unirBbox), { padding: 60, maxZoom: 14, duration: dur(700) });
        }

        function iniciarMapa() {
          var el = q("[data-cv-map]");
          map = new maplibregl.Map({
            container: el,
            style: { version: 8, sources: {}, layers: [] },
            center: [-55.2, -15.55], zoom: 9.5, minZoom: 7, maxZoom: 17,
            attributionControl: { compact: true }, dragRotate: false, pitchWithRotate: false
          });
          map.touchZoomRotate.disableRotation();
          map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-right");
          map.on("load", function () {
            map.addSource("s2", { type: "raster", tiles: tilesS2(state.year), tileSize: 256, maxzoom: 14, attribution: ATTR_S2 });
            map.addSource("esri", { type: "raster", tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, maxzoom: 19, attribution: ATTR_ESRI });
            map.addSource("plots", { type: "geojson", data: { type: "FeatureCollection", features: [] }, promoteId: "fid" });
            map.addSource("mun", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
            map.addLayer({ id: "bm-s2", type: "raster", source: "s2" });
            map.addLayer({ id: "bm-esri", type: "raster", source: "esri", layout: { visibility: "none" } });
            map.addLayer({ id: "plots-fill", type: "fill", source: "plots", paint: { "fill-color": "#fff", "fill-opacity": 0.5 } });
            map.addLayer({ id: "plots-line", type: "line", source: "plots", paint: { "line-color": "#fff", "line-width": 0.9 } });
            map.addLayer({ id: "plots-sel", type: "line", source: "plots", filter: ["==", ["get", "fid"], ""], paint: { "line-color": "#ffffff", "line-width": 3.2 } });
            map.addLayer({ id: "mun-line", type: "line", source: "mun", paint: { "line-color": "#ffe066", "line-width": 1.6, "line-dasharray": [3, 2] } });
            map.setLayoutProperty("bm-s2", "visibility", state.basemap === "s2" ? "visible" : "none");
            map.setLayoutProperty("bm-esri", "visibility", state.basemap === "esri" ? "visible" : "none");
            mapPronto = true;
            if (municipio) map.getSource("mun").setData(municipio);
            if (plots) map.getSource("plots").setData(plots);
            aplicarPicos();
            aplicarEstilo();
            atualizarBadge();
            aplicarVista();

            popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, className: "cv-map-popup", offset: 10 });
            map.on("mousemove", "plots-fill", function (e) {
              map.getCanvas().style.cursor = "pointer";
              var p = e.features[0].properties;
              var s = p["s" + state.season];
              var txt = "#" + numDe(p.fid) + " · " + fmt(p.area_ha, 1) + " " + T.ha + " · " + className(s === null || s === undefined || s === "null" ? null : s);
              popup.setLngLat(e.lngLat).setText(txt).addTo(map);
            });
            map.on("mouseleave", "plots-fill", function () {
              map.getCanvas().style.cursor = "";
              popup.remove();

          });

          var btnIn = q("[data-cv-zoom-in]"), btnOut = q("[data-cv-zoom-out]"), btnFit = q("[data-cv-zoom-fit]");
          if (btnIn) btnIn.addEventListener("click", function () { map.zoomIn(); });
          if (btnOut) btnOut.addEventListener("click", function () { map.zoomOut(); });
          if (btnFit) btnFit.addEventListener("click", ajustarMunicipio);

          // O mapa muda de altura entre cenas e ao mudar de coluna; acompanha o tamanho do contêiner
          if ("ResizeObserver" in window) {

        function carregarTalhoes(ano, cb) {
          fetch(base + "/talhoes-" + ano + ".geojson")
            .then(function (r) { return r.json(); })
            .then(function (g) {
              plots = g;
              anoCarregado = ano;
              plotsByFid = {};
              g.features.forEach(function (f) { plotsByFid[f.properties.fid] = f; });
              if (mapPronto) map.getSource("plots").setData(g);
              atualizarBadge();
              if (cb) cb();
            })
            .catch(function () {});
        }

        // Carrega as séries do ano para todos os índices em uso
        function carregarSeries(ano, cb) {
          seriesByIdx = {};
          var lista = indicesAtivos();
          if (!lista.length) { calcularPicos(); if (cb) cb(); return; }
          var pendentes = lista.length;
          lista.forEach(function (idx) {
            var chave = ano + "-" + idx;
            function pronto(d) {
              if (d && d.ano === state.year && indicesAtivos().indexOf(idx) >= 0) seriesByIdx[idx] = d;
              if (--pendentes === 0) { calcularPicos(); if (cb) cb(); }
            }
            if (seriesCache[chave]) { pronto(seriesCache[chave]); return; }
            fetch(base + "/indices-" + ano + "-" + idx + ".json")
              .then(function (r) { return r.json(); })
              .then(function (d) { seriesCache[chave] = d; pronto(d); })
              .catch(function () { pronto(null); });
          });
        }

        function calcularPicos() {
          peaks = {};
          var vals = [];
          var s = primeiroIndice() ? serieDe(primeiroIndice()) : null;
          if (!s) { peakRange = null; return; }
          Object.keys(s.talhoes).forEach(function (fid) {
            var arr = s.talhoes[fid], best = null, bi = -1;
            for (var i = 0; i < arr.length; i++) {
              if (arr[i] !== null && (best === null || arr[i] > best)) { best = arr[i]; bi = i; }
            }
            if (best !== null) { peaks[fid] = { v: best, i: bi }; vals.push(best); }
          });
          vals.sort(function (a, b) { return a - b; });
          peakRange = vals.length ? [vals[Math.floor(vals.length * 0.02)], vals[Math.floor(vals.length * 0.98)]] : null;
        }

        function aplicarPicos() {
          if (!mapPronto || !plots) return;
          plots.features.forEach(function (f) {
            var fid = f.properties.fid;
            var pk = peaks[fid];
            map.setFeatureState({ source: "plots", id: fid }, { peak: pk ? pk.v : null });
          });
        }

        function temSerie(fid) {
          var s = primeiroIndice() ? serieDe(primeiroIndice()) : null;
          return !s || !!s.talhoes[fid];
        }

        // Maior talhão soja/algodão com série: protagonista das cenas
        function talhaoPadrao() {
          var cands = plots.features.filter(function (f) {
            return f.properties.s1 === 0 && f.properties.s2 === 2 && temSerie(f.properties.fid);
          });
          if (!cands.length) cands = plots.features.slice();
          cands.sort(function (a, b) { return b.properties.area_ha - a.properties.area_ha; });
          return cands[0] ? cands[0].properties.fid : null;
        }

        // Talhão de 2ª safra que mais fica abaixo do P25 do município entre abril e agosto
        function talhaoAbaixo(excluir) {
          var s = primeiroIndice() ? serieDe(primeiroIndice()) : null;
          if (!s || !plots) return null;
          var i0 = 6, i1 = Math.min(14, s.datas.length - 1);
          var melhor = null, melhorN = 0;
          plots.features.forEach(function (f) {
            var p = f.properties, ser = s.talhoes[p.fid];
            if (!ser || p.fid === excluir || (p.s2 !== 1 && p.s2 !== 2) || p.area_ha < 30) return;
            var n = 0;
            for (var i = i0; i <= i1; i++) if (ser[i] !== null && ser[i] < s.regional.p25[i] - 0.03) n++;
            if (n > melhorN || (n === melhorN && melhor && p.area_ha > plotsByFid[melhor].properties.area_ha)) { melhor = p.fid; melhorN = n; }
          });
          return melhorN >= 3 ? melhor : null;
        }

        // Clique no mapa ou no botão "outro talhão": troca o talhão ativo ou
        // alterna o talhão na comparação, conforme o modo
        function selecionar(fid, centrar) {
          if (!plots) return;
          if (!fid || !plotsByFid[fid]) fid = talhaoPadrao();
          if (state.compare === "plots") {
            var pos = state.plotsSel.indexOf(fid);
            if (pos >= 0) state.plotsSel.splice(pos, 1);
            else if (state.plotsSel.length >= MAX_SEL) state.plotsSel[MAX_SEL - 1] = fid;
            else state.plotsSel.push(fid);
            state.selected = state.plotsSel[0] || fid;
          } else {
            state.selected = fid;
          }
          state.hoverIdx = -1;
          aplicarSelecao();
          atualizarLegenda();
          if (centrar) centrarNoTalhao(fid);
          atualizarChipsTalhoes();
          atualizarInspetorTalhao();
          renderIvCurve();
        }

        // Define o talhão ativo sem alternar a comparação
        function selecionarDireto(fid) {
          if (!fid || !plotsByFid[fid]) fid = state.plotsSel[0] || talhaoPadrao();
          state.selected = fid;
          state.hoverIdx = -1;
          aplicarSelecao();
          atualizarLegenda();
          atualizarChipsTalhoes();
          atualizarInspetorTalhao();
          renderIvCurve();
        }

        function atualizarChipsTalhoes() {
          var box = q("[data-cv-plot-chips]");
          if (!box) return;
          box.innerHTML = "";
          fidsSelecionados().forEach(function (f, i) {
            var p = plotsByFid[f] && plotsByFid[f].properties;
            var b = document.createElement("button");
            b.type = "button";
            b.className = "cv-plot-chip";
            b.style.setProperty("--chip", state.compare === "plots" ? SERIES[i] : "var(--gaia-accent)");
            b.textContent = "#" + numDe(f) + (p ? " · " + abbr(p.s1) + "/" + abbr(p.s2) : "");
            if (state.compare === "plots") {
              b.title = T.remove;
              b.appendChild(document.createTextNode(" ×"));
              b.addEventListener("click", function () { selecionar(f, false); });
            } else {
              b.title = T.locate;
              b.addEventListener("click", function () { centrarNoTalhao(f); });
            }
            box.appendChild(b);
          });
        }

        function atualizarInspetorTalhao() {
          var p = state.selected && plotsByFid[state.selected] ? plotsByFid[state.selected].properties : null;
          var classes = q("[data-cv-insp-classes]");
          if (classes) classes.hidden = state.compare === "plots";
          if (state.compare === "plots") {
            if (q("[data-parcel-title]")) q("[data-parcel-title]").textContent = T.plotsCmp;
            if (q("[data-parcel-meta]")) q("[data-parcel-meta]").textContent = state.plotsSel.map(function (f) { return "#" + numDe(f); }).join(" · ") + " · " + state.year;
            return;
          }
          if (!p) return;
          if (q("[data-parcel-title]")) q("[data-parcel-title]").textContent = T.plot + " #" + numDe(p.fid) + " (" + fmt(p.area_ha, 1) + " " + T.ha + " · Campo Verde, MT)";
          if (q("[data-parcel-meta]")) q("[data-parcel-meta]").textContent = "FID " + p.fid + " · " + state.year + (p.tiles > 1 ? " · " + T.tiles2 : "");
          [1, 2].forEach(function (s) {
            var g = p["s" + s], m = p["mb" + s];
            var el = q("[data-parcel-s" + s + "]"), er = q("[data-parcel-mb" + s + "]");
            var ambos = g !== null && g !== undefined && m !== null && m !== undefined;
            var div = ambos && g !== m;
            if (el) el.textContent = className(g);
            if (er) {
              er.textContent = className(m) + (ambos ? (div ? T.diverg : T.concord) : "");
              er.classList.toggle("is-error", div);
            }
          });
          var pk = peaks[p.fid];
          var s0 = primeiroIndice() ? serieDe(primeiroIndice()) : null;
          var lab = q("[data-parcel-peak-label]");
          if (lab) lab.textContent = T.peakOf.replace("{idx}", primeiroIndice() || "NDVI");
          if (q("[data-parcel-peak]")) q("[data-parcel-peak]").textContent = pk ? fmt(pk.v, 3) : T.noData;
          if (q("[data-parcel-peakdate]")) q("[data-parcel-peakdate]").textContent = pk && s0 ? s0.datas[pk.i] : T.noData;
        }

        // Sincroniza os botões com o estado (as cenas mudam o estado por fora)
        function marcarGrupo(sel, attr, valor) {
          qa(sel).forEach(function (b) {
            var act = b.getAttribute(attr) === String(valor);
            b.classList.toggle("is-active", act);
            b.setAttribute("aria-pressed", act ? "true" : "false");
          });
        }
        function marcarToggle(key, ligado) {
          var b = q('[data-iv-toggle="' + key + '"]');
          if (!b) return;
          b.classList.toggle("is-active", ligado);
          b.setAttribute("aria-pressed", ligado ? "true" : "false");
        }
        function sincronizarControles() {
          marcarGrupo("[data-cv-colormode]", "data-cv-colormode", state.mode);
          marcarGrupo("[data-cv-season]", "data-cv-season", state.season);
          marcarGrupo("[data-cv-cropfilter]", "data-cv-cropfilter", state.crop);
          marcarGrupo("[data-cv-basemap]", "data-cv-basemap", state.basemap);
          marcarGrupo("[data-cv-compare]", "data-cv-compare", state.compare);
          qa("[data-iv-index]").forEach(function (b) {
            var act = indicesAtivos().indexOf(b.getAttribute("data-iv-index")) >= 0;
            b.classList.toggle("is-active", act);
            b.setAttribute("aria-pressed", act ? "true" : "false");
          });
          marcarToggle("band", state.showBand);
          marcarToggle("median", state.showMedian);
          marcarToggle("markers", state.markers);
          if (opSlider) opSlider.value = Math.round(state.opacity * 100);
          if (opVal) opVal.textContent = Math.round(state.opacity * 100) + "%";
          sincronizarAno();
          atualizarChipsTalhoes();
        }

        // Controles do mapa
        function grupo(sel, chave, depois) {
          var btns = qa(sel);
          btns.forEach(function (btn) {
            btn.addEventListener("click", function () {
              btns.forEach(function (b) {
                var act = b === btn;
                b.classList.toggle("is-active", act);
                b.setAttribute("aria-pressed", act ? "true" : "false");
              });
              depois(btn.getAttribute(chave));
            });
          });
        }
        var btnPrev = q("[data-cv-year-prev]"), btnNext = q("[data-cv-year-next]"), yearVal = q("[data-cv-year-val]");
        function sincronizarAno() {
          var i = ANOS.indexOf(state.year);
          if (yearVal) yearVal.textContent = state.year;
          if (btnPrev) btnPrev.disabled = i <= 0;
          if (btnNext) btnNext.disabled = i >= ANOS.length - 1;
        }
        function passoAno(delta) {
          var i = ANOS.indexOf(state.year) + delta;
          if (i < 0 || i >= ANOS.length) return;
          mudarAno(ANOS[i]);
          sincronizarAno();
        }
        if (btnPrev) btnPrev.addEventListener("click", function () { passoAno(-1); });
        if (btnNext) btnNext.addEventListener("click", function () { passoAno(1); });
        sincronizarAno();
        grupo("[data-cv-season]", "data-cv-season", function (v) { state.season = parseInt(v, 10); aplicarEstilo(); });
        grupo("[data-cv-colormode]", "data-cv-colormode", function (v) { state.mode = v; aplicarEstilo(); });
        grupo("[data-cv-cropfilter]", "data-cv-cropfilter", function (v) { state.crop = v; aplicarEstilo(); });
        grupo("[data-cv-basemap]", "data-cv-basemap", function (v) { state.basemap = v; aplicarFundo(); });
        function aplicarFundo() {
          if (mapPronto) {
            map.setLayoutProperty("bm-s2", "visibility", state.basemap === "s2" ? "visible" : "none");
            map.setLayoutProperty("bm-esri", "visibility", state.basemap === "esri" ? "visible" : "none");
          }
          atualizarBadge();
        }
        var opSlider = q("[data-cv-opacity]"), opVal = q("[data-cv-opacity-val]");
        if (opSlider) {
          opSlider.addEventListener("input", function () {
            state.opacity = parseInt(opSlider.value, 10) / 100;
            if (opVal) opVal.textContent = opSlider.value + "%";
            aplicarEstilo();
          });
        }

        function mudarAno(ano) {
          state.year = ano;
          if (mapPronto) map.getSource("s2").setTiles(tilesS2(ano));
          var anterior = state.selected, anteriores = state.plotsSel.slice();
          carregarTalhoes(ano, function () {
            carregarSeries(ano, function () {
              aplicarPicos();
              aplicarEstilo();
              state.plotsSel = anteriores.filter(function (f) { return plotsByFid[f]; });
              if (state.compare === "plots" && !state.plotsSel.length) state.plotsSel = [talhaoPadrao()];
              selecionarDireto(anterior && plotsByFid[anterior] ? anterior : null);
            });
          });
        }

        function recarregarSeries() {
          carregarSeries(state.year, function () {
            aplicarPicos();
            aplicarEstilo();
            atualizarInspetorTalhao();
            renderIvCurve();
          });
        }

        // Controles da série temporal
        grupo("[data-cv-compare]", "data-cv-compare", function (v) {
          state.compare = v;
          if (v === "plots") {
            state.plotsSel = state.selected ? [state.selected] : [];
            state.indices = state.indices.slice(0, 1);
            if (!state.indices.length) state.indices = ["NDVI"];
          } else {
            state.selected = state.plotsSel[0] || state.selected;
          }
          state.hoverIdx = -1;
          sincronizarControles();
          aplicarSelecao();
          atualizarLegenda();
          recarregarSeries();
        });
        qa("[data-iv-index]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var idx = btn.getAttribute("data-iv-index");
            var pos = state.indices.indexOf(idx);
            if (state.compare === "plots") {
              state.indices = [idx];
            } else if (pos >= 0) {
              state.indices.splice(pos, 1);
            } else {
              if (state.indices.length >= MAX_SEL) return;
              state.indices.push(idx);
            }
            sincronizarControles();
            recarregarSeries();
          });
        });
        qa("[data-iv-toggle]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var key = btn.getAttribute("data-iv-toggle");
            var act = btn.classList.toggle("is-active");
            btn.setAttribute("aria-pressed", act ? "true" : "false");
            if (key === "band") state.showBand = act;
            if (key === "median") state.showMedian = act;
            if (key === "markers") state.markers = act;
            renderIvCurve();
          });
        });
        var randBtn = q("[data-iv-random]");
        if (randBtn) {
          randBtn.addEventListener("click", function () {
            if (!plots) return;
            var cands = plots.features.filter(function (f) {
              return temSerie(f.properties.fid) && fidsSelecionados().indexOf(f.properties.fid) < 0;
            });
            if (!cands.length) cands = plots.features;
            var f = cands[Math.floor(Math.random() * cands.length)];
            if (state.compare === "plots" && state.plotsSel.length >= MAX_SEL) state.plotsSel.pop();
            selecionar(f.properties.fid, true);
          });
        }

        function passoBonito(bruto) {
          var p = Math.pow(10, Math.floor(Math.log10(bruto)));
          var r = bruto / p;
          var m = r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10;
          return m * p;
        }

        function caminho(vals, xAt, yAt) {
          var d = "", aberto = false;
          for (var i = 0; i < vals.length; i++) {
            if (vals[i] === null || vals[i] === undefined) { aberto = false; continue; }
            d += (aberto ? " L " : " M ") + xAt(i).toFixed(1) + "," + yAt(vals[i]).toFixed(1);
            aberto = true;
          }
          return d.trim();
        }

        function svgEl(tag, attrs) {
          var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
          Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
          return e;
        }

        // Marcos de início (SOS), pico (POS) e fim (EOS) de cada ciclo, calculados
        // fora da página pelo detector de safra sobre o NDVI de cada talhão.
        // O arquivo do ano é buscado na primeira vez em que os marcos são pedidos.
        var marcosCache = {};
        function marcosDe(ano, fid) {
          if (marcosCache[ano] === undefined) {
            marcosCache[ano] = null;
            fetch(base + "/marcos-" + ano + ".json")
              .then(function (r) { return r.json(); })
              .then(function (d) {
                marcosCache[ano] = d.talhoes;
                if (state.year === ano && state.markers) renderIvCurve();
              })
              .catch(function () {});
          }
          var saida = [];
          ((marcosCache[ano] || {})[fid] || []).forEach(function (ciclo) {
            ["sos", "pos", "eos"].forEach(function (tipo, k) {
              if (ciclo[k]) saida.push({ data: ciclo[k], tipo: tipo });
            });
          });
          return saida;
        }

        var pontosPorLinha = [];   // [[circle por data] por linha], para sincronizar o destaque

        function destacarData(idx) {
          state.hoverIdx = idx;
          pontosPorLinha.forEach(function (pts) {
            pts.forEach(function (c, i) { if (c) c.setAttribute("r", i === idx ? 5.5 : 3.8); });
          });
          atualizarInspetorIv(idx);
        }

        // Um painel: eixo próprio, faixa e mediana do município e uma ou mais linhas
        // (índices de um talhão: uma linha por painel; talhões: uma linha por talhão)
        function renderPainel(container, idx, s, linhas, ultimo) {
          var reg = s.regional;
          var n = s.datas.length;
          var lo = Infinity, hi = -Infinity;
          function acum(v) { if (v !== null && v !== undefined) { if (v < lo) lo = v; if (v > hi) hi = v; } }
          linhas.forEach(function (l) { l.ser.forEach(acum); });
          if (state.showBand) { reg.p25.forEach(acum); reg.p75.forEach(acum); }
          if (state.showMedian) reg.p50.forEach(acum);
          if (!isFinite(lo)) { lo = 0; hi = 1; }
          if (hi - lo < 1e-6) { hi = lo + 0.1; }
          var passo = passoBonito((hi - lo) / 4);
          lo = Math.floor(lo / passo) * passo;
          hi = Math.ceil(hi / passo) * passo;
          var casas = passo >= 1 ? 0 : passo >= 0.1 ? 1 : passo >= 0.01 ? 2 : 3;

          var alturaBase = state.locked ? 236 : 172;
          var altura = alturaBase + (ultimo ? 18 : 0);
          var x0 = 42, x1 = 932, y0 = 16, y1 = alturaBase - 8;
          function xAt(i) { return x0 + (i / (n - 1)) * (x1 - x0); }
          function yAt(v) { return y1 - ((v - lo) / (hi - lo)) * (y1 - y0); }

          var painel = document.createElement("div");
          painel.className = "cv-iv-panel";
          var titulo = document.createElement("div");
          titulo.className = "cv-iv-panel-title";
          var chip = q('[data-iv-index="' + idx + '"]');
          titulo.textContent = (chip && chip.getAttribute("title") ? chip.getAttribute("title") : idx)
            + " · " + T.band + " (" + fmtInt(Object.keys(s.talhoes).length) + " " + T.plots + ")";
          painel.appendChild(titulo);
          var svg = svgEl("svg", { viewBox: "0 0 1000 " + altura, style: "width:100%; height:auto; display:block;", role: "img" });
          painel.appendChild(svg);

          for (var g = lo; g <= hi + passo / 2; g += passo) {
            var yy = yAt(g).toFixed(1);
            var baseLinha = Math.abs(g - lo) < 1e-9;
            svg.appendChild(svgEl("line", { x1: x0, y1: yy, x2: x1, y2: yy, stroke: "currentColor", "stroke-opacity": baseLinha ? 0.24 : 0.12, "stroke-dasharray": baseLinha ? "" : "3 3" }));
            var t = svgEl("text", { x: x0 - 6, y: (parseFloat(yy) + 3.5).toFixed(1), "font-size": 10, fill: "currentColor", opacity: 0.65, "text-anchor": "end" });
            t.textContent = fmt(g, casas);
            svg.appendChild(t);
          }

          if (ultimo) {
            var ano = s.ano;
            var d0 = Date.parse(s.datas[0] + "T00:00:00Z"), dN = Date.parse(s.datas[n - 1] + "T00:00:00Z");
            for (var mth = 0; mth < 12; mth += 2) {
              var frac = (Date.UTC(ano, mth, 1) - d0) / (dN - d0);
              var tm = svgEl("text", { x: (x0 + frac * (x1 - x0)).toFixed(1), y: altura - 6, "font-size": 10, fill: "currentColor", opacity: 0.7, "text-anchor": mth === 0 ? "start" : "middle" });
              tm.textContent = MESES[mth];
              svg.appendChild(tm);
            }
          }

          // Rótulo no fim da linha, no lugar de uma legenda separada
          function rotuloFim(vals, texto, cor, peso) {
            var k = n - 1;
            while (k >= 0 && (vals[k] === null || vals[k] === undefined)) k--;
            if (k < 0) return;
            var tx = svgEl("text", { x: x1 + 7, y: (yAt(vals[k]) + 3.5).toFixed(1), "font-size": 11, "font-weight": peso || 400, fill: cor, "text-anchor": "start" });
            tx.textContent = texto;
            svg.appendChild(tx);
          }

          if (state.showBand) {
            var topo = reg.p75.map(function (v, i) { return xAt(i).toFixed(1) + "," + yAt(v).toFixed(1); });
            var fundo = reg.p25.slice().reverse().map(function (v, ri) { return xAt(n - 1 - ri).toFixed(1) + "," + yAt(v).toFixed(1); });
            svg.appendChild(svgEl("path", { d: "M " + topo.join(" L ") + " L " + fundo.join(" L ") + " Z", fill: "rgba(79, 138, 34, 0.16)" }));
          }
          if (state.showMedian) {
            svg.appendChild(svgEl("path", { d: caminho(reg.p50, xAt, yAt), fill: "none", stroke: "#689f38", "stroke-width": 1.5, "stroke-dasharray": "4 3", opacity: 0.75 }));
            rotuloFim(reg.p50, T.median, "#689f38");
          }
          linhas.forEach(function (l) {
            svg.appendChild(svgEl("path", { d: caminho(l.ser, xAt, yAt), fill: "none", stroke: l.cor, "stroke-width": 3.2 }));
            rotuloFim(l.ser, l.rotulo, l.cor, 700);
            var pts = [];
            for (var j = 0; j < n; j++) {
              (function (i) {
                if (l.ser[i] === null || l.ser[i] === undefined) { pts.push(null); return; }
                var c = svgEl("circle", { "class": "cv-iv-point", cx: xAt(i).toFixed(1), cy: yAt(l.ser[i]).toFixed(1), r: i === state.hoverIdx ? 5.5 : 3.8, fill: l.cor, stroke: "#ffffff", "stroke-width": 1.3 });
                c.addEventListener("mouseenter", function () { destacarData(i); });
                c.addEventListener("click", function () { destacarData(i); });
                svg.appendChild(c);
                pts.push(c);
              })(j);
            }
            pontosPorLinha.push(pts);
          });

          if (state.markers && linhas.length === 1) {
            // A data do marco cai entre duas observações de 16 dias: a posição no
            // eixo e a altura sobre a curva são interpoladas entre as duas
            var ser0 = linhas[0].ser, dia0 = Date.parse(s.datas[0]), passoDias = (Date.parse(s.datas[n - 1]) - dia0) / (n - 1);
            marcosDe(s.ano, linhas[0].fid).forEach(function (m) {
              var pos = Math.max(0, Math.min(n - 1, (Date.parse(m.data) - dia0) / passoDias));
              var a = Math.floor(pos), b = Math.min(n - 1, a + 1);
              if (ser0[a] === null || ser0[b] === null) return;
              var cx = xAt(pos), cy = yAt(ser0[a] + (ser0[b] - ser0[a]) * (pos - a));
              var cor = m.tipo === "pos" ? "var(--gaia-accent)" : MARCOS[m.tipo];
              svg.appendChild(svgEl("circle", { cx: cx.toFixed(1), cy: cy.toFixed(1), r: 7, fill: "none", stroke: cor, "stroke-width": 2.4 }));
              var acima = m.tipo === "pos";
              var tx = svgEl("text", { x: cx.toFixed(1), y: (acima ? cy - 12 : cy + 20).toFixed(1), "font-size": 11, "font-weight": 700, fill: cor, "text-anchor": "middle" });
              tx.textContent = T[m.tipo];
              svg.appendChild(tx);
            });
          }
          container.appendChild(painel);
        }

        function renderIvCurve() {
          var vazio = q("[data-iv-empty]"), paineis = q("[data-iv-panels]");
          if (!paineis) return;
          paineis.innerHTML = "";
          pontosPorLinha = [];
          var fids = fidsSelecionados();
          var validos = indicesAtivos().filter(function (idx) { return serieDe(idx); });
          var msg = null;
          if (!indicesAtivos().length) msg = T.noIndex;
          else if (!validos.length) msg = T.noSeries.replace("{ano}", state.year);
          else if (!fids.length) msg = T.noPlots;
          else if (!fids.some(function (f) { return serieDe(validos[0]).talhoes[f]; })) msg = T.noSeries.replace("{ano}", state.year);
          if (msg) {
            vazio.hidden = false;
            vazio.textContent = msg;
            atualizarInspetorIv(-1);
            return;
          }
          vazio.hidden = true;

          if (state.compare === "plots") {
            var s = serieDe(validos[0]);
            var linhas = [];
            fids.forEach(function (f, i) {
              if (s.talhoes[f]) linhas.push({ ser: s.talhoes[f], cor: SERIES[i], rotulo: "#" + numDe(f), fid: f });
            });
            renderPainel(paineis, validos[0], s, linhas, true);
          } else {
            validos.forEach(function (idx, k) {
              var s2 = serieDe(idx);
              var ser = s2.talhoes[fids[0]];
              if (!ser) return;
              renderPainel(paineis, idx, s2, [{ ser: ser, cor: "var(--gaia-accent)", rotulo: "#" + numDe(fids[0]), fid: fids[0] }], k === validos.length - 1);
            });
          }

          var padrao = state.hoverIdx;
          if (padrao < 0) padrao = peaks[fids[0]] ? peaks[fids[0]].i : 0;
          destacarData(padrao);
        }

        function celula(rotulo, valor, classe) {
          var cell = document.createElement("div");
          cell.className = "parcel-compare-cell";
          var sp = document.createElement("span");
          sp.textContent = rotulo;
          var st = document.createElement("strong");
          st.textContent = valor;
          if (classe) st.className = classe;
          cell.appendChild(sp);
          cell.appendChild(st);
          return cell;
        }

        // Leitura da data destacada: uma linha por índice ou uma linha por talhão
        function atualizarInspetorIv(idx) {
          var elD = q("[data-iv-insp-date]"), linhas = q("[data-iv-insp-rows]"), elS = q("[data-iv-insp-status]");
          if (!linhas) return;
          linhas.innerHTML = "";
          var fids = fidsSelecionados();
          var validos = indicesAtivos().filter(function (i) { return serieDe(i); });
          var algum = validos.length && fids.some(function (f) { return serieDe(validos[0]).talhoes[f]; });
          if (!algum || idx < 0) {
            if (elD) elD.textContent = "";
            if (elS) elS.textContent = !indicesAtivos().length ? T.noIndex : !fids.length ? T.noPlots : T.noSeries.replace("{ano}", state.year);
            return;
          }
          if (elD) elD.textContent = serieDe(validos[0]).datas[idx];
          var frases = [];
          function posicao(v, s) {
            var p25 = s.regional.p25[idx], p75 = s.regional.p75[idx];
            return v === null || v === undefined ? null : v > p75 ? "above" : v < p25 ? "below" : "within";
          }
          if (state.compare === "plots") {
            var s = serieDe(validos[0]);
            fids.forEach(function (f, i) {
              if (!s.talhoes[f]) return;
              var p = plotsByFid[f].properties;
              var v = s.talhoes[f][idx], pos = posicao(v, s);
              var row = document.createElement("div");
              row.className = "parcel-compare-row cv-insp-row cv-insp-row-5";
              row.style.setProperty("--chip", SERIES[i]);
              row.appendChild(celula(T.iPlot, "#" + numDe(f), "cv-iv-chip-name"));
              row.appendChild(celula(T.iSeasons, className(p.s1) + " / " + className(p.s2)));
              row.appendChild(celula(T.iVal, fmt(v, 3)));
              row.appendChild(celula(T.iMed, fmt(s.regional.p50[idx], 3)));
              row.appendChild(celula(T.iPos, pos ? T[pos] : T.noData));
              linhas.appendChild(row);
              if (pos) frases.push("#" + numDe(f) + ": " + T[pos === "above" ? "stAbove" : pos === "below" ? "stBelow" : "stWithin"]);
            });
          } else {
            validos.forEach(function (i) {
              var s2 = serieDe(i);
              if (!s2.talhoes[fids[0]]) return;
              var v = s2.talhoes[fids[0]][idx], pos = posicao(v, s2);
              var row = document.createElement("div");
              row.className = "parcel-compare-row cv-insp-row";
              row.style.setProperty("--chip", "var(--gaia-accent)");
              row.appendChild(celula(T.iIdx, i, "cv-iv-chip-name"));
              row.appendChild(celula(T.iVal, fmt(v, 3)));
              row.appendChild(celula(T.iMed, fmt(s2.regional.p50[idx], 3)));
              row.appendChild(celula(T.iPos, pos ? T[pos] : T.noData));
              linhas.appendChild(row);
              if (pos) frases.push(i + ": " + T[pos === "above" ? "stAbove" : pos === "below" ? "stBelow" : "stWithin"]);
            });
          }
          if (elS) elS.textContent = frases.join(" ");
        }

        // Cenas da narrativa: cada passo define um estado completo do palco.
        // A última ("explore") só libera os controles, sem mexer no estado.
        var CENAS = {
          delim: { mode: "outline", season: 1, vista: "mun", series: false },
          classe: { mode: "gaia", season: 1, vista: "mun", series: false },
          diverg: { mode: "diverg", season: 2, vista: "mun", series: false },
          series: { mode: "gaia", season: 1, vista: "talhao", series: true, compare: "indices", markers: false },
          fenol: { mode: "gaia", season: 1, vista: "talhao", series: true, compare: "indices", markers: true },
          viz: { mode: "gaia", season: 2, vista: "par", series: true, compare: "plots", markers: false },
          explore: { livre: true }
        };

        function aplicarVista() {
          if (!mapPronto || !plots || !cenaAtual) return;
          var c = CENAS[cenaAtual];
          if (!c || c.livre) return;
          if (c.vista === "mun") ajustarMunicipio();
          else if (c.vista === "talhao") centrarNoTalhao(state.selected);
          else if (c.vista === "par") centrarNosTalhoes(state.plotsSel);
        }

        function preencherLegendaTexto(passo) {
          var cap = q("[data-cv-caption]");
          var src = passo && passo.querySelector("[data-cv-caption-text]");
          if (!cap) return;
          var html = src ? src.innerHTML : "";
          var s = primeiroIndice() ? serieDe(primeiroIndice()) : null;
          html = html.replace("{n}", s ? fmtInt(Object.keys(s.talhoes).length) : "…");
          html = html.replace("{a}", state.plotsSel[0] ? "#" + numDe(state.plotsSel[0]) : "…");
          html = html.replace("{b}", state.plotsSel[1] ? "#" + numDe(state.plotsSel[1]) : "…");
          cap.innerHTML = html;
          cap.hidden = !html;
        }

        // Tela cheia: o painel cobre a janela, com o mapa e as séries lado a lado
        var btnMax = q("[data-cv-max]");
        function telaCheia(ligar) {
          agroViewer.classList.toggle("is-max", ligar);
          document.documentElement.classList.toggle("cv-max-open", ligar);
          if (btnMax) {
            btnMax.textContent = btnMax.getAttribute(ligar ? "data-label-off" : "data-label-on");
            btnMax.setAttribute("aria-pressed", ligar ? "true" : "false");
          }
          if (map) map.resize();
        }
        if (btnMax) {
          btnMax.addEventListener("click", function () { telaCheia(!agroViewer.classList.contains("is-max")); });
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && agroViewer.classList.contains("is-max")) telaCheia(false);
          });
        }

        var slotLivre = document.querySelector("[data-cv-stage-slot]");
        var colunaPalco = agroViewer.parentNode;
        function moverPalco(livre) {
          if (!livre) telaCheia(false);
          var destino = livre ? slotLivre : colunaPalco;
          if (!destino || agroViewer.parentNode === destino) return;
          destino.appendChild(agroViewer);
          if (map) map.resize();
        }

        function aplicarCena(nome, passo) {
          var c = CENAS[nome];
          if (!c) return;
          cenaAtual = nome;
          passoAtual = passo;
          if (c.livre) {
            state.locked = false;
            agroViewer.classList.remove("is-locked");
            agroViewer.classList.add("has-series");
            moverPalco(true);
            sincronizarControles();
            preencherLegendaTexto(null);
            renderIvCurve();
            return;
          }
          var compareAntes = state.compare, anoAntes = state.year;
          state.locked = true;
          state.year = 2021;
          state.crop = "all";
          state.basemap = "s2";
          state.opacity = 0.62;
          state.mode = c.mode;
          state.season = c.season;
          state.markers = !!c.markers;
          state.showBand = true;
          state.showMedian = true;
          state.compare = c.compare || "indices";
          state.indices = ["NDVI"];
          state.hoverIdx = -1;
          agroViewer.classList.add("is-locked");
          agroViewer.classList.toggle("has-series", !!c.series);
          moverPalco(false);
          if (mapPronto) {
            if (anoAntes !== state.year) map.getSource("s2").setTiles(tilesS2(state.year));
            aplicarFundo();
          }
          function depois() {
            if (plots) {
              var padrao = talhaoPadrao();
              if (state.compare === "plots") {
                var abaixo = talhaoAbaixo(padrao);
                state.plotsSel = abaixo ? [padrao, abaixo] : [padrao];
              } else {
                state.plotsSel = [];
              }
              state.selected = padrao;
            }
            aplicarPicos();
            aplicarEstilo();
            sincronizarControles();
            atualizarInspetorTalhao();
            renderIvCurve();
            preencherLegendaTexto(passo);
            aplicarVista();
          }
          if (anoCarregado !== state.year) {
            carregarTalhoes(state.year, function () { carregarSeries(state.year, depois); });
          } else if (!serieDe("NDVI") || compareAntes !== state.compare) {
            carregarSeries(state.year, depois);
          } else depois();
        }

        // Espião de rolagem: o passo ativo é o último cujo topo passou do meio da tela
        var passos = story ? Array.prototype.slice.call(story.querySelectorAll("[data-scene]")) : [];
        var agendado = false;
        function espiar() {
          agendado = false;
          if (!passos.length) return;
          var meio = window.innerHeight * 0.5, ativo = passos[0];
          for (var i = 0; i < passos.length; i++) {
            if (passos[i].getBoundingClientRect().top <= meio) ativo = passos[i];
          }
          if (ativo === passoAtual) return;
          passos.forEach(function (p) { p.classList.toggle("is-active", p === ativo); });
          aplicarCena(ativo.getAttribute("data-scene"), ativo);
        }
        function agendarEspia() {
          if (agendado) return;
          agendado = true;
          requestAnimationFrame(espiar);
        }

        // Carga inicial: limite, talhões e séries do ano padrão; o mapa só é
        // montado quando o palco se aproxima da tela
        fetch(base + "/municipio.geojson").then(function (r) { return r.json(); }).then(function (g) {
          municipio = g;
          if (mapPronto) { map.getSource("mun").setData(g); aplicarVista(); }
        }).catch(function () {});
        carregarTalhoes(state.year, function () {
          carregarSeries(state.year, function () {
            aplicarPicos();
            aplicarEstilo();
            if (passos.length) {
              passoAtual = null;
              espiar();
              window.addEventListener("scroll", agendarEspia, { passive: true });
              window.addEventListener("resize", agendarEspia);
            }
            else {
              state.locked = false;
              agroViewer.classList.remove("is-locked");
              agroViewer.classList.add("has-series");
              selecionarDireto(null);
            }
          });
        });
        var montar = function () { carregarMapLibre(iniciarMapa); };
        if ("IntersectionObserver" in window) {
          var io = new IntersectionObserver(function (entries) {
            if (entries.some(function (e) { return e.isIntersecting; })) { io.disconnect(); montar(); }
          }, { rootMargin: "800px 0px" });
          io.observe(agroViewer);
        } else montar();
      })();
    }

    // Visualizador de Floresta (Campo Verde, MT)
    var forestViewers = document.querySelectorAll("[data-cv-forest-viewer]");
    for (var fv = 0; fv < forestViewers.length; fv++) {
      (function (root) {
        var viewport = root.querySelector(".cv-sat-viewport");
        var stage = root.querySelector(".cv-sat-stage");
        if (!viewport || !stage) return;
        initPanZoomStage(viewport, stage, 1400, 880, root);

        var baseImg = root.querySelector("[data-cv-f-base]");
        var predImg = root.querySelector('[data-cv-f-layer="pred"]');
        var badgeEl = root.querySelector("[data-cv-sat-badge]");
        var qBtns = root.querySelectorAll("[data-cv-f-quarter]");
        var clipBtns = root.querySelectorAll("[data-cv-f-clip]");
        var layBtns = root.querySelectorAll("[data-cv-f-toggle]");
        var opSlider = root.querySelector("[data-cv-f-opacity]");
        var opVal = root.querySelector("[data-cv-f-opacity-val]");

        var fState = {
          quarter: "2023q3",
          clip: "completo",
          opacity: 0.78
        };

        function syncForestLayers() {
          if (baseImg) baseImg.src = "images/floresta/cv-rgb-" + fState.quarter + ".webp";
          if (predImg) {
            if (fState.clip === "car" && fState.quarter === "2023q3") {
              predImg.src = "images/floresta/cv-pred-car-2023q3.webp";
            } else {
              predImg.src = "images/floresta/cv-pred-completo-" + fState.quarter + ".webp";
            }
            predImg.style.opacity = String(fState.opacity);
          }
          var incImg = root.querySelector('[data-cv-f-layer="incerteza"]');
          if (incImg) incImg.style.opacity = String(fState.opacity);
          var rotImg = root.querySelector('[data-cv-f-layer="rotulo"]');
          if (rotImg) rotImg.style.opacity = String(fState.opacity);
        }

        qBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            fState.quarter = btn.getAttribute("data-cv-f-quarter");
            qBtns.forEach(function (b) {
              var act = b === btn;
              b.classList.toggle("is-active", act);
              b.setAttribute("aria-pressed", act ? "true" : "false");
            });
            if (badgeEl) badgeEl.textContent = btn.getAttribute("data-badge") || fState.quarter.toUpperCase();
            syncForestLayers();
          });
        });

        clipBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            fState.clip = btn.getAttribute("data-cv-f-clip");
            clipBtns.forEach(function (b) {
              var act = b === btn;
              b.classList.toggle("is-active", act);
              b.setAttribute("aria-pressed", act ? "true" : "false");
            });
            syncForestLayers();
          });
        });

        layBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            var lay = btn.getAttribute("data-cv-f-toggle");
            var isOn = btn.classList.toggle("is-active");
            btn.setAttribute("aria-pressed", isOn ? "true" : "false");
            var imgEl = root.querySelector('[data-cv-f-layer="' + lay + '"]');
            if (imgEl) imgEl.classList.toggle("is-hidden", !isOn);
          });
        });

        if (opSlider) {
          opSlider.addEventListener("input", function () {
            fState.opacity = parseInt(opSlider.value, 10) / 100;
            if (opVal) opVal.textContent = opSlider.value + "%";
            syncForestLayers();
          });
        }

        syncForestLayers();
      })(forestViewers[fv]);
    }
  });
</script>
