<script>
/* Secao de listagem sem ninguem nao e publicada: o script oculta tanto a secao
   no corpo da pagina quanto o link e o item li correspondente no sumario lateral,
   evitando acumulo de gaps no flexbox. Paginas com abas de filtro ficam de fora. */
(function () {
  function esconderSecoesVazias() {
    if (document.querySelector(".side-toc-link[data-view]")) return;

    var listagens = document.querySelectorAll("section.level2 > .quarto-listing");
    for (var i = 0; i < listagens.length; i++) {
      var secao = listagens[i].closest("section.level2");
      if (!secao) continue;
      if (secao.querySelector(".quarto-grid-item, .quarto-listing-item, .listing-box, .card")) continue;

      secao.classList.add("secao-vazia");
      secao.style.setProperty("display", "none", "important");

      var secId = secao.id || "";
      var secIdDecoded = decodeURIComponent(secId);
      var links = document.querySelectorAll(".side-toc-link");
      for (var j = 0; j < links.length; j++) {
        var a = links[j];
        var href = a.getAttribute("href") || "";
        var hash = href.indexOf("#") !== -1 ? href.substring(href.indexOf("#") + 1) : "";
        var hashDecoded = decodeURIComponent(hash);
        if (hash === secId || hashDecoded === secIdDecoded || hash === secIdDecoded || hashDecoded === secId) {
          a.classList.add("secao-vazia");
          a.style.setProperty("display", "none", "important");
          var li = a.closest("li");
          if (li) {
            li.classList.add("secao-vazia");
            li.style.setProperty("display", "none", "important");
          }
        }
      }
    }
  }

  esconderSecoesVazias();
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", esconderSecoesVazias);
  }
  window.addEventListener("load", esconderSecoesVazias);
})();
</script>
