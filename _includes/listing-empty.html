<script>
/* Secao de listagem sem ninguem nao e publicada (ver styles.css): o CSS ja esconde
   pelo :has(); aqui vai a mesma conta em JS, que tambem tira o link e o item li do
   sumario lateral, evitando acumulo de gaps no flexbox. Paginas com abas de filtro
   ficam de fora, porque la filtrar pode esvaziar uma secao na hora. */
(function () {
  if (document.querySelector(".side-toc-link[data-view]")) return;

  var listagens = document.querySelectorAll("section.level2 > .quarto-listing");
  for (var i = 0; i < listagens.length; i++) {
    var secao = listagens[i].closest("section.level2");
    if (!secao) continue;
    if (secao.querySelector(".quarto-grid-item, .quarto-listing-item")) continue;
    secao.classList.add("secao-vazia");
    // href termina em "#id": os scripts do Quarto as vezes reescrevem a ancora
    // como URL completa (com ou sem codificacao de URL)
    var idEncoded = encodeURIComponent(secao.id);
    var seletor = 'a.side-toc-link[href$="#' + secao.id + '"], a.side-toc-link[href$="#' + idEncoded + '"]';
    var links = document.querySelectorAll(seletor);
    for (var j = 0; j < links.length; j++) {
      links[j].classList.add("secao-vazia");
      var li = links[j].closest("li");
      if (li) {
        li.classList.add("secao-vazia");
      }
    }
  }
})();
</script>
