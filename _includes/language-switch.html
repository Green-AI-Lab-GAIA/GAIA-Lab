<script>
  // Faz o link PT/EN da navbar apontar para a versão da página atual no outro
  // idioma. Suporta tanto hospedagem na raiz (/) quanto sob subdiretório (como /GAIA-Lab/
  // no GitHub Pages). A posição de rolagem é guardada no clique e restaurada na página equivalente.
  (function () {
    var CHAVE = "gaia-scroll-troca-idioma";

    // Restaura a rolagem salva por uma troca de idioma recém-feita
    try {
      var salvo = JSON.parse(sessionStorage.getItem(CHAVE) || "null");
      sessionStorage.removeItem(CHAVE);
      if (salvo && Date.now() - salvo.quando < 10000) {
        window.scrollTo({ top: salvo.y, left: 0, behavior: "instant" });
      }
    } catch (erro) { /* sem sessionStorage; segue a partir do topo */ }

    var secoes = ["about", "research", "publications", "courses", "people", "join-us", "news", "index.html"];

    function analisarUrl() {
      var p = window.location.pathname;
      var partes = p.split("/").filter(Boolean);

      var repo = "";
      var emIngles = false;
      var resto = [];

      if (partes.length > 0) {
        if (partes[0].toLowerCase() === "en") {
          if (partes.length > 1 && !secoes.includes(partes[1].toLowerCase())) {
            // Caso de URL invertida (/en/GAIA-Lab/...)
            repo = partes[1];
            emIngles = true;
            resto = partes.slice(2);
          } else {
            // Hospedagem na raiz (/en/...)
            emIngles = true;
            resto = partes.slice(1);
          }
        } else if (!secoes.includes(partes[0].toLowerCase())) {
          // Primeiro segmento é o repositório (/GAIA-Lab/...)
          repo = partes[0];
          if (partes.length > 1 && partes[1].toLowerCase() === "en") {
            emIngles = true;
            resto = partes.slice(2);
          } else {
            emIngles = false;
            resto = partes.slice(1);
          }
        } else {
          // Hospedagem na raiz (/research/...)
          emIngles = false;
          resto = partes;
        }
      }

      // Se o atributo lang do HTML for inglês, confirma emIngles
      if (document.documentElement && document.documentElement.lang && document.documentElement.lang.indexOf("en") === 0) {
        emIngles = true;
      }

      return {
        repo: repo,
        base: repo ? ("/" + repo) : "",
        emIngles: emIngles,
        resto: resto
      };
    }

    function calcularDestino() {
      var info = analisarUrl();
      var novoCaminho = "";

      if (info.emIngles) {
        // De inglês -> português: remove o /en
        if (info.resto.length === 0) {
          novoCaminho = info.base ? (info.base + "/") : "/";
        } else {
          var ultimo = info.resto[info.resto.length - 1];
          var barraFinal = ultimo.includes(".") ? "" : "/";
          novoCaminho = info.base + "/" + info.resto.join("/") + barraFinal;
        }
      } else {
        // De português -> inglês: adiciona /en após a base do repositório
        if (info.resto.length === 0) {
          novoCaminho = info.base + "/en/";
        } else {
          var ultimo = info.resto[info.resto.length - 1];
          var barraFinal = ultimo.includes(".") ? "" : "/";
          novoCaminho = info.base + "/en/" + info.resto.join("/") + barraFinal;
        }
      }

      novoCaminho = novoCaminho.replace(/\/+/g, "/");
      return novoCaminho + window.location.search;
    }

    function atualizarRodape(base, emIngles) {
      var footerLinks = document.querySelectorAll(".site-footer a[href^='/']");
      for (var f = 0; f < footerLinks.length; f++) {
        var rawHref = footerLinks[f].getAttribute("data-original-href");
        if (!rawHref) {
          rawHref = footerLinks[f].getAttribute("href");
          footerLinks[f].setAttribute("data-original-href", rawHref);
        }
        if (rawHref && rawHref.startsWith("/")) {
          var prefix = emIngles ? (base + "/en") : base;
          var cleanHref = rawHref === "/" ? "/" : rawHref;
          footerLinks[f].href = (prefix + cleanHref).replace(/\/+/g, "/");
        }
      }
    }

    function configurarBotaoIdioma() {
      var info = analisarUrl();
      var label = info.emIngles ? "EN" : "PT";
      var destino = calcularDestino();

      var links = document.querySelectorAll(".navbar a.nav-link");
      for (var i = 0; i < links.length; i++) {
        var texto = links[i].textContent.trim();
        if (texto === label || links[i].classList.contains("lang-switch") || /^[A-Za-z]{2}$/.test(texto)) {
          if (texto === "EN" || texto === "PT" || links[i].classList.contains("lang-switch")) {
            links[i].classList.add("lang-switch");
            links[i].href = destino;
            links[i].title = info.emIngles ? "Ler em português" : "Read in English";
            links[i].onclick = function (evento) {
              evento.preventDefault();
              try {
                sessionStorage.setItem(CHAVE, JSON.stringify({
                  y: window.scrollY,
                  quando: Date.now()
                }));
              } catch (erro) { /* sem sessionStorage; segue */ }
              window.location.href = calcularDestino();
            };
          }
        }
      }
    }

    function inicializar() {
      var info = analisarUrl();
      configurarBotaoIdioma();
      atualizarRodape(info.base, info.emIngles);
    }

    inicializar();
    document.addEventListener("DOMContentLoaded", inicializar);
    window.addEventListener("pageshow", inicializar);
  })();
</script>
