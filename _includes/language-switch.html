<script>
  // Faz o link PT/EN da navbar apontar para a versão da página atual no outro
  // idioma. Suporta tanto hospedagem na raiz (/) quanto sob subdiretório (como /GAIA-Lab/
  // no GitHub Pages). A posição de rolagem é guardada no clique e restaurada na página equivalente.
  document.addEventListener("DOMContentLoaded", function () {
    var CHAVE = "gaia-scroll-troca-idioma";

    // Restaura a rolagem salva por uma troca de idioma recém-feita
    try {
      var salvo = JSON.parse(sessionStorage.getItem(CHAVE) || "null");
      sessionStorage.removeItem(CHAVE);
      if (salvo && Date.now() - salvo.quando < 10000) {
        window.scrollTo({ top: salvo.y, left: 0, behavior: "instant" });
      }
    } catch (erro) { /* sem sessionStorage; segue a partir do topo */ }

    var isEnglish = document.documentElement.lang.indexOf("en") === 0;
    var path = window.location.pathname;

    // Detecta o caminho base do site a partir do link da marca da navbar
    var brand = document.querySelector(".navbar-brand");
    var base = "";
    if (brand) {
      try {
        var resolved = new URL(brand.getAttribute("href"), window.location.href).pathname;
        base = resolved.replace(/\/index\.html$/, "").replace(/\/$/, "");
        // Se estiver em inglês, remove o /en final da base para achar o prefixo do repositório
        if (isEnglish && base.endsWith("/en")) {
          base = base.slice(0, -3);
        }
      } catch (e) { base = ""; }
    }

    var target;
    if (isEnglish) {
      // De inglês para português: remove "/en" do caminho
      target = path.replace(/\/en(\/|$)/, "/") || (base ? base + "/" : "/");
    } else {
      // De português para inglês: insere "/en" após o prefixo base
      var rel = (base && path.startsWith(base)) ? path.slice(base.length) : path;
      if (!rel.startsWith("/")) rel = "/" + rel;
      target = base + "/en" + rel;
    }

    // Corrige os links do rodapé para respeitarem o caminho base e o idioma atual
    var footerLinks = document.querySelectorAll(".site-footer a[href^='/']");
    for (var f = 0; f < footerLinks.length; f++) {
      var rawHref = footerLinks[f].getAttribute("href");
      if (rawHref && rawHref.startsWith("/")) {
        var prefix = isEnglish ? (base + "/en") : base;
        var cleanHref = rawHref === "/" ? "/" : rawHref;
        footerLinks[f].href = (prefix + cleanHref).replace(/\/+/g, "/");
      }
    }

    // O botão exibe a sigla do idioma atual e o clique leva ao outro idioma
    var label = isEnglish ? "EN" : "PT";
    var links = document.querySelectorAll(".navbar a.nav-link");
    for (var i = 0; i < links.length; i++) {
      if (links[i].textContent.trim() === label) {
        links[i].href = target;
        links[i].title = isEnglish ? "Ler em português" : "Read in English";
        // A classe permite estilizar o botão de idioma no styles.css
        links[i].classList.add("lang-switch");
        links[i].addEventListener("click", function () {
          try {
            sessionStorage.setItem(CHAVE, JSON.stringify({
              y: window.scrollY,
              quando: Date.now()
            }));
          } catch (erro) { /* sem sessionStorage; a troca abre no topo */ }
        });
        break;
      }
    }
  });
</script>
