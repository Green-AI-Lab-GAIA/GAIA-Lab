# Configuração comum aos dois idiomas.
# As opções específicas de cada idioma ficam nos perfis:
#   _quarto-pt.yml -> português, publicado na raiz (docs/)
#   _quarto-en.yml -> inglês, publicado em docs/en/
project:
  type: website
  # Remove o sufixo de idioma dos arquivos gerados (index.pt.html -> index.html)
  post-render: scripts/flatten_lang.py

# Sem --profile, "quarto render" e "quarto preview" usam o português
profile:
  default: pt

# Título fixo da aba do navegador, igual em todas as páginas
pagetitle: "GAIA Lab"

website:
  title: "GAIA Lab"
  navbar:
    background: "#365902"
    # Busca desativada até o site ter volume de conteúdo que a justifique
    search: false

format:
  html:
    # Tema claro e escuro; o Quarto adiciona o botão de alternância na navbar.
    # O escuro usa a mesma base cosmo com uma camada apenas de cores, para a
    # troca de modo nunca alterar tamanhos ou layout
    theme:
      light: cosmo
      dark: [cosmo, theme-dark.scss]
    linkcolor: "#365902"
    css: styles.css
    toc: true
    # Favicon com versão para tema claro e escuro do navegador
    include-in-header: _includes/favicon.html
    # Scripts de comportamento: troca de idioma por página, links externos em
    # nova aba, cópia de e-mail e efeitos de rolagem (reveal, carrossel,
    # contadores, comparador de imagens, exploradores e envio da inscrição)
    include-after-body:
      - _includes/language-switch.html
      - _includes/link-behavior.html
      - _includes/scroll-effects.html
      - _includes/explorers.html
      - _includes/form-inscricao.html
      - _includes/image-fallback.html
      - _includes/publication-filters.html
