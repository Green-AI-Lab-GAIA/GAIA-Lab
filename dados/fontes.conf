# Endereco de cada planilha publicada em CSV.
#
# No Google Sheets: Arquivo, Compartilhar, Publicar na web, escolher a aba e o
# formato CSV, e colar aqui o endereco gerado. Publicar na web nao exige login de
# quem le, entao o job do cron baixa sem guardar credencial nenhuma na maquina.
#
# Deixe a linha comentada enquanto a planilha nao existir: o job pula a tabela e
# mantem o CSV que ja esta versionado em dados/.
#
# As imagens nao vem no CSV: o formulario de upload grava na celula o endereco do
# arquivo no Drive, e scripts/baixar_imagens.py busca o arquivo. Para isso a pasta
# de respostas do formulario precisa estar compartilhada como "qualquer pessoa com
# o link", senao o Google devolve a pagina de login e o job para.
#
